# .github/workflows/run_adv.yml
name: Run JMA ADV

on:
  schedule:
    - cron: "30 22 * * *"  # 07:30 JST（前日22:30 UTC）
    - cron: "30 5  * * *"  # 14:30 JST
    - cron: "30 10 * * *"  # 19:30 JST
  workflow_dispatch: {}

concurrency:
  group: run-adv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_adv:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"

      # =====================
      # ★ ADV（認証あり）：Authorization を付ける
      # =====================
      TGV_USE_AUTH: "1"

      # =====================
      # 配信モード：Slack画像投稿はしない（エラー通知のみSlack）
      # =====================
      DELIVERY_MODE: "both"

      # =====================
      # Mail（mail_utils参照）
      # =====================
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_SUBJECT_PREFIX: "JMA"
      SMTP_STARTTLS: "1"
      MAIL_DEBUG: "0"
      MAX_MAIL_SIZE_MB: "20"

      # =====================
      # JMA ADV 認証
      # =====================
      JMA_ADV_USER: ${{ secrets.JMA_ADV_USER }}
      JMA_ADV_PASS: ${{ secrets.JMA_ADV_PASS }}
      JMA_AUTH_BASIC: ${{ secrets.JMA_AUTH_BASIC }}

      # =====================
      # Slack（エラー通知用：入っていれば使う）
      # =====================
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_CHUNK: "10"

      # =====================
      # ADV script tuning
      # =====================
      JPG_QUALITY: "85"
      INIT_SEARCH_HOURS: "72"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug env (presence only)
        shell: bash
        run: |
          set -euo pipefail
          for v in TGV_USE_AUTH JMA_ADV_USER JMA_ADV_PASS JMA_AUTH_BASIC SLACK_CHANNEL_ID; do
            if [ -n "${!v:-}" ]; then
              echo "$v=OK"
            else
              echo "$v=MISSING"
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pillow
          fi

      # ★ Run ADV script の直前：超軽量 sanity（DDHHMM / 6時間刻み / 最大5回）
      - name: Sanity check GSM (warn only)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ok=0

          # 直近24hをざっくり（6時間刻み）× 分候補(00/03/06) で「200が1個でも出るか」
          for back in 0 6 12 18 24; do
            ddhh=$(date -u -d "${back} hour ago" +"%d%H")
            for mm in 00 03 06; do
              rjtd="${ddhh}${mm}"
              url="https://www.jma.go.jp/bosai/tgv/data/GSMWide/300/images/VIEW3001003_RJTD_${rjtd}.png"
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                -u "${JMA_ADV_USER}:${JMA_ADV_PASS}" \
                -H "Referer: https://www.jma.go.jp/bosai/tgv/GSM/" \
                "$url")
              echo "GSM RJTD=${rjtd} HTTP=${code} url=${url}"
              if [ "$code" = "200" ]; then ok=1; break 2; fi
            done
          done

          if [ "$ok" != "1" ]; then
            echo "GSM sanity WARN: no HTTP200 in last 24h (this does NOT fail the job)"
          fi


      - name: Run ADV script
        run: |
          python scripts/jma_adv.py
