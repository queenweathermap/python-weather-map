name: Run JMA ADV TGV

on:
  schedule:
    # 02:00 / 08:00 / 14:00 / 20:00 JST
    - cron: "0 17 * * *"   # 02:00 JST
    - cron: "0 23 * * *"   # 08:00 JST
    - cron: "0 5  * * *"   # 14:00 JST
    - cron: "0 11 * * *"   # 20:00 JST
  workflow_dispatch: {}

concurrency:
  group: run-adv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-adv:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

      # Slack
      SLACK_ENABLE: "1"
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      # 配信モード
      DELIVERY_MODE: "notion"

      # JMA ADV 認証
      TGV_USE_AUTH: "1"
      JMA_ADV_USER: ${{ secrets.JMA_ADV_USER }}
      JMA_ADV_PASS: ${{ secrets.JMA_ADV_PASS }}
      JMA_AUTH_BASIC: ${{ secrets.JMA_AUTH_BASIC }}

      # 画像処理
      JPG_QUALITY: "85"
      INIT_SEARCH_HOURS: "72"
      JOIN_TRIPLE: "1"

      # R2
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "adv-tgv"

      # Notion
      NOTION_ENABLE: "1"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      NOTION_PROP_TITLE: "名前"
      NOTION_PROP_CATEGORY: "区分"
      NOTION_PROP_MODEL: "区分"
      NOTION_PROP_INIT_JST: "発行基準時刻"
      NOTION_PROP_RJTD: "RJTD"
      NOTION_PROP_PREFIX: "prefix"
      NOTION_PROP_R2URL: "R2 URL"
      NOTION_PROP_AUTOGEN: "自動生成"
      NOTION_PROP_MEMO: "メモ"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-adv.txt

      - name: Run JMA ADV TGV
        run: python scripts/jma_adv.py
