name: run_adv

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date (YYYY-MM-DD). Empty = today"
        required: false
        default: ""
  schedule:
    # 毎日 07:05 JST = 22:05 UTC（目安）
    - cron: "5 22 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo

      # Optional override
      RUN_DATE: ${{ github.event.inputs.run_date }}

      # SMTP (required)
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_SUBJECT_PREFIX: ${{ secrets.MAIL_SUBJECT_PREFIX }}

      # R2 (optional)
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

      # Slack (optional)
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_POST_IMAGES: ${{ secrets.SLACK_POST_IMAGES }}
      SLACK_POST_ERRORS: ${{ secrets.SLACK_POST_ERRORS }}

      # Notion (optional)
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests boto3 notion-client

      - name: Debug env presence (safe)
        run: |
          for k in SMTP_HOST SMTP_USER SMTP_PASS MAIL_FROM MAIL_TO SMTP_PORT; do
            v="${!k}"
            if [ -z "$v" ]; then
              echo "$k = MISSING"
            else
              echo "$k = OK (len=${#v})"
            fi
          done

      - name: Run JMA ADV
        run: |
          python scripts/jma_adv.py
