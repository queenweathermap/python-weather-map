name: Run JMA ADV TGV

on:
  schedule:
    # 03:10 / 09:10 / 15:10 / 21:10 JST
    # 18:10 / 00:10 / 06:10 / 12:10 UTC
    - cron: "10 18,0,6,12 * * *"

  workflow_dispatch:
    inputs:
      join_triple:
        description: "画像を3枚結合（3up）するか"
        required: false
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # JMA ADV 認証
      # ------------------------------------------------------------
      TGV_USE_AUTH: "1"
      JMA_ADV_USER: ${{ secrets.JMA_ADV_USER }}
      JMA_ADV_PASS: ${{ secrets.JMA_ADV_PASS }}
      JMA_AUTH_BASIC: ${{ secrets.JMA_AUTH_BASIC }}

      # ------------------------------------------------------------
      # R2
      # ※画像URLの公開ベースURLは、以前の運用どおり ASSET_BASE_URL を使う
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "adv-tgv"

      # ------------------------------------------------------------
      # Notion
      # ------------------------------------------------------------
      NOTION_ENABLE: "1"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      NOTION_PROP_TITLE: "名前"
      NOTION_PROP_CATEGORY: "区分"
      NOTION_PROP_INIT_JST: "発行基準時刻"
      NOTION_PROP_MEMO: "メモ"
      NOTION_PROP_RJTD: "RJTD"
      NOTION_PROP_PREFIX: "prefix"
      NOTION_PROP_R2URL: "R2 URL"
      NOTION_PROP_AUTOGEN: "自動生成"

      # ------------------------------------------------------------
      # Discord
      # ADV専用チャンネル
      # ------------------------------------------------------------
      DISCORD_ENABLE: "1"
      DISCORD_ADV_WEBHOOK_URL: ${{ secrets.DISCORD_ADV_WEBHOOK_URL }}
      DISCORD_MAX_IMAGES_PER_MESSAGE: "10"
      DISCORD_SLEEP_SEC: "1.0"

      # ------------------------------------------------------------
      # Slackは停止
      # ------------------------------------------------------------
      SLACK_ENABLE: "0"
      SLACK_WEBHOOK_URL: ""

      # ------------------------------------------------------------
      # 画像・取得設定
      # ------------------------------------------------------------
      JOIN_TRIPLE: ${{ github.event_name == 'workflow_dispatch' && inputs.join_triple || 'true' }}
      JPG_QUALITY: "85"
      HTTP_TIMEOUT: "60"
      INIT_SEARCH_HOURS: "72"
      GUIDE_ENABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow boto3 notion-client

      - name: Run ADV TGV
        run: |
          python scripts/jma_adv.py
