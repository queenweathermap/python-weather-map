name: Run Climate

on:
  schedule:
    # GitHub Actions の cron は UTC。JST 01:00 に投稿したい。
    #   16日 01:00 JST = 15日 16:00 UTC
    #   1日  01:00 JST = 前月末日 16:00 UTC（末日は月で変わるため 28-31 を広めに指定し、
    #                    実際に JST 1日/16日でない起動は本体スクリプト側でゲートして即終了）
    - cron: "0 16 15 * *"
    - cron: "0 16 28,29,30,31 * *"

  workflow_dispatch:
    inputs:
      target_month:
        description: "対象月 (1-12) 空なら自動"
        required: false
        default: ""
      target_half:
        description: "first(前半1-15) / second(後半16-末) 空なら自動"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # 手動実行(workflow_dispatch)のときは投稿日ゲートを無視して必ず実行する
      CLIMATE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      CLIMATE_POST_DAYS: "1,16"
      CLIMATE_TARGET_MONTH: ${{ github.event.inputs.target_month }}
      CLIMATE_TARGET_HALF: ${{ github.event.inputs.target_half }}

      # ------------------------------------------------------------
      # Discord 専用チャンネル（新規: climate-3year）
      # ------------------------------------------------------------
      DISCORD_ENABLE: "1"
      DISCORD_CLIMATE_WEBHOOK_URL: ${{ secrets.DISCORD_CLIMATE_WEBHOOK_URL }}

      # ------------------------------------------------------------
      # Bluesky 自動投稿（無料 / AT Protocol）
      #   BLUESKY_HANDLE 例: yourname.bsky.social
      #   BLUESKY_APP_PASSWORD は Settings→App Passwords で発行したもの
      # ------------------------------------------------------------
      BLUESKY_ENABLE: "1"
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

      # ------------------------------------------------------------
      # X（旧Twitter・従量課金）: tweepy でメディア付き投稿
      # ------------------------------------------------------------
      X_ENABLE: "1"
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      # ------------------------------------------------------------
      # Threads（Meta・無料）: 画像は公開URL(R2)から取得される
      # ------------------------------------------------------------
      THREADS_ENABLE: "1"
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

      # ------------------------------------------------------------
      # R2（任意・高解像度PNGの置き場）
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "climate"
      R2_RETENTION_DAYS: "30"
      R2_CLEANUP_DRY_RUN: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese fonts (matplotlib 日本語化)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml matplotlib boto3 astral tzdata pillow tweepy

      - name: Run Climate Akita (2枚まとめ投稿)
        run: |
          python scripts/climate_akita.py

      - name: Cleanup old R2 objects
        if: always()
        run: |
          python scripts/r2_cleanup.py
