# .github/workflows/local_weather.yml
# ===============================================
# Local Weather Panel Generator（任意地点／手動トリガー）
# -----------------------------------------------
# このGitHub Actionsワークフローは、
# 任意地点の気象パネル（天気図）を1回ごとに手動で生成するためのものです。
#
# ★ 利用シーン
# - 管理画面やActionsタブから「Run workflow」でパラメータを入力し、即時生成・Drive連携。
# - 将来的にMSMが安定運用に戻れば「model=msm」も選択肢として有効。
#
# ★ パラメータ
# - model: データ種別（GSMまたはMSMを指定、デフォルトはGSM）
# - city: 地名（自由入力、例："Nagaoka Fireworks"）
# - pin_lat, pin_lon: ピンポイント地点の緯度・経度
# - lat/lon_min/max: 可視化範囲の指定
#
# ★ 処理内容
# - 依存パッケージインストール
# - 任意地点のパネル生成スクリプト実行（必要なパラメータを全て渡す）
# - Google Drive連携のため、サービスアカウント等の環境変数もセット
# ===============================================

name: Local Weather Panel

on:
  # --- 手動実行トリガー（Run workflow時に下記パラメータを入力） ---
  workflow_dispatch:
    inputs:
      model:
        description: 'データ種別（msm or gsm）'
        required: false
        default: 'gsm'
        type: choice
        options:
          - gsm
          - msm
      city:
        description: '地名（例：Nagaoka Fireworks）'
        required: true
        type: string
      pin_lat:
        description: 'ピンポイント緯度（例：37.4462）'
        required: true
        type: number
      pin_lon:
        description: 'ピンポイント経度（例：138.8521）'
        required: true
        type: number
      lat_min:
        description: '範囲の最小緯度'
        required: true
        type: number
      lat_max:
        description: '範囲の最大緯度'
        required: true
        type: number
      lon_min:
        description: '範囲の最小経度'
        required: true
        type: number
      lon_max:
        description: '範囲の最大経度'
        required: true
        type: number

jobs:
  run-local-panel:
    runs-on: ubuntu-latest
    steps:
      # --- リポジトリの最新ソースをチェックアウト ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 必要なPythonパッケージをインストール ---
      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- ローカル天気パネル生成スクリプトを実行（各種パラメータをコマンドラインで渡す） ---
      - name: Run local weather panel script
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 gpv_panel_daily_local.py \
            --model "${{ github.event.inputs.model }}" \
            --city "${{ github.event.inputs.city }}" \
            --pin_lat ${{ github.event.inputs.pin_lat }} \
            --pin_lon ${{ github.event.inputs.pin_lon }} \
            --lat_range ${{ github.event.inputs.lat_min }} ${{ github.event.inputs.lat_max }} \
            --lon_range ${{ github.event.inputs.lon_min }} ${{ github.event.inputs.lon_max }}

# ===============================================
