# .github/workflows/local_weather.yml
# ===============================================
# Local Weather Panel Generator（任意地点／手動トリガー）
# -----------------------------------------------
# このGitHub Actionsワークフローは、
# 任意地点の気象パネル（天気図）を1回ごとに手動で生成するためのものです。
#
# ★ 利用シーン
# - 管理画面やActionsタブから「Run workflow」でパラメータを入力し、即時生成・Drive連携。
# - 将来的にMSMが安定運用に戻れば「model=msm」も選択肢として有効。
#
# ★ パラメータ
# - model: データ種別（GSMまたはMSMを指定、デフォルトはGSM）
# - city: 地名（自由入力、例："Nagaoka Fireworks"）
# - pin_lat, pin_lon: ピンポイント地点の緯度・経度
# - lat/lon_min/max: 可視化範囲の指定
#
# ★ 処理内容
# - 依存パッケージインストール
# - 任意地点のパネル生成スクリプト実行（必要なパラメータを全て渡す）
# - Google Drive連携のため、サービスアカウント等の環境変数もセット
# ===============================================

name: Local Weather Panel


on:
  workflow_dispatch:
    inputs:
      model:
        description: 'データ種別（gsm or msm）'
        required: true
        default: 'msm'
        type: choice
        options:
          - gsm
          - msm
      city:
        description: '地名（例：Nagaoka Fireworks）'
        required: true
        type: string
      pin_lat:
        description: 'ピンポイント緯度（例：37.4462）'
        required: true
        type: number
      pin_lon:
        description: 'ピンポイント経度（例：138.8521）'
        required: true
        type: number
      range_width:
        description: '中心からの半径（度, デフォルト2.5）'
        required: false
        default: 2.5
        type: number

jobs:
  run-local-panel:
    runs-on: ubuntu-latest
    steps:
      # ...省略...
      - name: Run local weather panel script
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 gpv_panel_daily_local.py \
            --model "${{ github.event.inputs.model }}" \
            --city "${{ github.event.inputs.city }}" \
            --pin_lat ${{ github.event.inputs.pin_lat }} \
            --pin_lon ${{ github.event.inputs.pin_lon }} \
            --range_width ${{ github.event.inputs.range_width }}
