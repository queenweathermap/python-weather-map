# .github/workflows/daily_weather.yml
# ===============================================
# Daily Weather Map（GRIB2直接処理版・Slack通知・Google Drive連携）
# cfgrib/xarray対応。wgrib2/NetCDF依存なし
# 2025-06-21 by ChatGPT
# ===============================================

name: JAPAN Weather Panel

on:
  schedule:
    - cron: '0 4 * * *'   # JST 13時
  workflow_dispatch:

# daily_weather_japan.yml の一部例
jobs:
  panel_msm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run MSM daily panel
        run: python gpv_panel_daily_japan_msm.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          run: |
            python3 main_weather_batch.py
