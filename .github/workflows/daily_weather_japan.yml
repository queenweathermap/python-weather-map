# .github/workflows/daily_weather.yml
# ===============================================
# Daily Weather Map（GSM/MSM両対応版・Slack通知・Google Drive連携）
# 毎日JST 5時/17時自動実行＋手動実行もOK
# wgrib2はNOAA公式ソースからv3.7.0をビルド（どんな環境でも安定再現）
# 2025-06-19 by ChatGPT
# ===============================================

name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'   # JST 5時
    - cron: '0 8 * * *'    # JST 17時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install build tools for wgrib2
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc gfortran zlib1g-dev libpng-dev wget

      - name: Install wgrib2
        run: |
          sudo apt-get update
          sudo apt-get install -y wgrib2
          wgrib2 -V


      - name: Run weather batch (main_weather_batch.py)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 main_weather_batch.py
