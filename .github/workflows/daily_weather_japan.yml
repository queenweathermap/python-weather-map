# .github/workflows/daily_weather.yml
# ===============================================
# Daily Weather Map（GRIB2直接処理版・Slack通知・Google Drive連携）
# cfgrib/xarray対応。wgrib2/NetCDF依存なし
# 2025-06-21 by ChatGPT
# ===============================================

name: Daily Weather Map

on:
  schedule:
    - cron: '0 4 * * *'   # JST 13時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libeccodes0 libeccodes-dev \
            libgeos-dev proj-bin proj-data libproj-dev \
            fonts-ipafont-gothic

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install eccodes cfgrib xarray cartopy pandas numpy matplotlib metpy scipy requests python-dotenv slack_sdk google-api-python-client google-auth-httplib2 google-auth beautifulsoup4 ipython
          pip install -r requirements.txt

      - name: Run weather batch (main_weather_batch.py)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 main_weather_batch.py
