# .github/workflows/daily_weather.yml
# ===============================================
# Daily Weather Map（GSM/MSM両対応・Slack通知・Google Drive連携）
# JST 5時/17時に自動実行＋手動実行対応
# wgrib2はNOAA公式バイナリから直接ダウンロードし絶対に確保
# 2025-06-19 改訂 by ChatGPT
# ===============================================

name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install build dependencies for wgrib2
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc gfortran zlib1g-dev libpng-dev

      - name: Download wgrib2 source
        run: |
          wget https://github.com/NOAA-EMC/wgrib2/archive/refs/tags/v3.7.0.tar.gz
          tar xvf v3.7.0.tar.gz

      - name: 解凍ディレクトリの内容を確認
        run: |
          ls -l wgrib2-3.7.0
          ls -l wgrib2-3.7.0/wgrib2 || true


      - name: Build wgrib2
        run: |
          cd wgrib2-3.7.0
          make
          sudo cp ./wgrib2/wgrib2 /usr/local/bin/wgrib2
          sudo chmod +x /usr/local/bin/wgrib2
          wgrib2 -V


      - name: Run weather batch (main_weather_batch.py)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 main_weather_batch.py
