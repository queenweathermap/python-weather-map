# .github/workflows/daily_weather.yml
# ===============================================
# Daily Weather Map（GSM/MSM両対応・Slack通知・Google Drive連携）
# JST 5時/17時に自動実行＋手動実行対応
# wgrib2はNOAA公式バイナリから直接ダウンロードし絶対に確保
# 2025-06-19 改訂 by ChatGPT
# ===============================================

name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'   # JST 5時
    - cron: '0 8 * * *'    # JST 17時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Confirm Python and pip versions
        run: |
          which python
          python --version
          which pip
          pip --version

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip show python-dotenv
          pip freeze

      # 念のためdotenvだけ再インストール（トラブル時のみ有効化でもOK）
      # - name: Force install python-dotenv
      #   run: pip install --upgrade --force-reinstall python-dotenv

      - name: Install build dependencies for wgrib2
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc gfortran zlib1g-dev libpng-dev libnetcdf-dev

      - name: Download wgrib2 source
        run: |
          wget https://github.com/NOAA-EMC/wgrib2/archive/refs/tags/v3.7.0.tar.gz
          tar xvf v3.7.0.tar.gz

      - name: Build wgrib2 with NetCDF support
        run: |
          cd wgrib2-3.7.0
          mkdir build
          cd build
          cmake .. -DENABLE_NETCDF=ON -DENABLE_JASPER=OFF -DENABLE_PNG=OFF \
            -DNETCDF_INCLUDE_DIR=/usr/include \
            -DNETCDF_LIBRARY=/usr/lib/x86_64-linux-gnu/libnetcdf.so
          make -j4
          sudo cp wgrib2/wgrib2 /usr/local/bin/wgrib2
          sudo chmod +x /usr/local/bin/wgrib2
          wgrib2 -V || true
          ldd /usr/local/bin/wgrib2 | grep netcdf || true

      - name: Run weather batch (main_weather_batch.py)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 main_weather_batch.py
