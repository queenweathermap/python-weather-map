# .github/workflows/daily_weather.yml
# ===============================================
# Daily Weather Map（GSM/MSM両対応・Slack通知・Google Drive連携）
# JST 5時/17時に自動実行＋手動実行対応
# wgrib2はNOAA公式バイナリから直接ダウンロードし絶対に確保
# 2025-06-19 改訂 by ChatGPT
# ===============================================

name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'   # JST 5時
    - cron: '0 8 * * *'    # JST 17時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download wgrib2 binary from NOAA
        run: |
          wget -O wgrib2.tgz "https://www.ftp.cpc.ncep.noaa.gov/wd51we/wgrib2/wgrib2.tgz"
          tar xvf wgrib2.tgz
          ls -lR .
          # バイナリ候補を探してcp
          file=$(find . -type f -name 'wgrib2' -perm /111 | head -n 1)
          if [ -n "$file" ]; then
            echo "Found wgrib2 binary: $file"
            sudo cp "$file" /usr/local/bin/wgrib2
            sudo chmod +x /usr/local/bin/wgrib2
            wgrib2 -V
          else
            echo "[ERROR] wgrib2バイナリが見つかりません"
            exit 1
          fi



      - name: Run weather batch (main_weather_batch.py)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 main_weather_batch.py
