name: Run JMA Weather Map

on:
  schedule:
    # 05:00 / 17:00 JST（短時間解説資料 03:40/15:40 発表に対応）
    # 20:00 / 08:00 UTC
    - cron: "0 20,8 * * *"

  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # Weathercaster 認証
      # ------------------------------------------------------------
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}

      # ------------------------------------------------------------
      # R2
      # ※画像URLの公開ベースURLは、以前の運用どおり ASSET_BASE_URL を使う
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "weathermap"
      R2_RETENTION_DAYS: "21"
      R2_CLEANUP_DRY_RUN: "0"

      # ------------------------------------------------------------
      # Notion
      # ------------------------------------------------------------
      NOTION_ENABLE: "1"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_IMPORT_IMAGES: "1"
      NOTION_IMPORT_TIMEOUT_SECONDS: "240"
      NOTION_IMPORT_POLL_SECONDS: "2.0"

      NOTION_PROP_TITLE: "名前"
      NOTION_PROP_CATEGORY: "区分"
      NOTION_PROP_INIT_JST: "発行基準時刻"
      NOTION_PROP_MEMO: "メモ"
      NOTION_PROP_RJTD: "RJTD"
      NOTION_PROP_PREFIX: "prefix"
      NOTION_PROP_R2URL: "R2 URL"
      NOTION_PROP_AUTOGEN: "自動生成"

      # ------------------------------------------------------------
      # Discord
      # Weathercaster / JMA天気図 専用チャンネル
      # ------------------------------------------------------------
      DISCORD_ENABLE: "1"
      DISCORD_WEATHERCASTER_WEBHOOK_URL: ${{ secrets.DISCORD_WEATHERCASTER_WEBHOOK_URL }}
      DISCORD_MAX_IMAGES_PER_MESSAGE: "10"
      DISCORD_SLEEP_SEC: "1.0"

      # Discord高解像度投稿
      # 1〜3枚目はPNG添付を優先。
      # 大きすぎる場合は、画素数を維持してJPEG化して投稿。
      # 4〜5枚目は小さいサムネイルを添付し、高解像度PNG本体はR2リンクで開く。
      DISCORD_UPLOAD_AS_FILE: "1"
      DISCORD_MAX_UPLOAD_MB: "8"
      DISCORD_JPEG_QUALITY: "88"
      DISCORD_THUMB_MAX_WIDTH: "1200"
      DISCORD_THUMB_JPEG_QUALITY: "84"

      # ------------------------------------------------------------
      # Slackは停止
      # ------------------------------------------------------------
      SLACK_ENABLE: "0"
      SLACK_WEBHOOK_URL: ""

      # ------------------------------------------------------------
      # Mail
      # Gmail/SMTPのサイズ制限・拒否が出たため停止。
      # 以後は Discord + Notion で配信する。
      # ------------------------------------------------------------
      MAIL_ENABLE: "0"
      MAIL_SLACK_NOTIFY: "0"
      MAIL_SLACK_MODE: "off"

      # ------------------------------------------------------------
      # PDF / PNG設定
      # 高解像度解析用。weather_map.py は PDF_DPI を優先し、
      # 未設定時だけ JPEG_DPI を参照する。
      # ------------------------------------------------------------
      PDF_DPI: "220"
      JPEG_DPI: "220"
      JPEG_QUALITY: "85"
      PNG_OPTIMIZE: "1"

      # 発行基準時刻の推定に使うPDF
      WEATHERCASTER_ISSUE_PROBE_PDFS: "COMP12.pdf,COMP36.pdf,COMP72.pdf"

      # エマグラム
      EMAGRAM_ENABLE: "1"
      EMAGRAM_URL: "https://bk-pro.jp/images/ema/ema_aki_00.gif"
      EMAGRAM_FILENAME: "ema_aki_00.gif"

      # ------------------------------------------------------------
      # ⑤ WCN週間予報（秋田県）
      # ④週間の直後に、会員ページのスクショ1枚を差し込む。
      # ハッシュ #9 = 秋田。Basic認証は上の WEATHERCASTER_USER/PASS を使う。
      # ------------------------------------------------------------
      WCN_WEEK_ENABLE: "1"
      WCN_WEEK_URL: "https://www.weathercaster.jp/web/member_only/weather-data/jma_yoho/week_show.cgi#9"
      WCN_WEEK_PREF_TEXT: "秋田"
      WCN_WEEK_VIEWPORT_WIDTH: "1200"
      WCN_WEEK_VIEWPORT_HEIGHT: "1000"
      WCN_WEEK_WAIT_MS: "2500"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow pdf2image boto3 notion-client playwright

      - name: Install Playwright browser (for WCN週間予報 screenshot)
        run: |
          playwright install chromium

      - name: Run Weathercaster
        run: |
          python scripts/jma_weathermap.py

      - name: Cleanup old R2 objects
        if: always()
        run: |
          python scripts/r2_cleanup.py
