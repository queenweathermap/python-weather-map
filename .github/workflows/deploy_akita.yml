name: Deploy Akita Job

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/**"
      - "module/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy_akita.yml"
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 3 * * *"  # 12:00 JST = 03:00 UTC

concurrency:
  group: deploy-akita-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPO }}/akita-panels:latest
      REGION: ${{ secrets.GCP_REGION }}

    steps:
      - uses: actions/checkout@v4

      # ===== GCP 認証 =====
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ===== Build & Push to Artifact Registry =====
      - uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and Push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # ===== Cloud Run Job の更新（イメージ＆環境変数）=====
      - name: Deploy Akita Job
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          job: akita-panels
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          flags: >-
            --cpu=4
            --memory=16Gi
            --task-timeout=3600
            --max-retries=1
          env_vars: |
            # アプリ向け
            PYTHONPATH=/app
            MPLCONFIGDIR=/tmp/matplotlib
            # 送付先
            MAIL_TO=${{ secrets.TO_EMAIL }}
            # GCS（使う場合）
            GCS_BUCKET=akita-weather-panels
            # SMTP（mail_utils.py 用）
            FROM_EMAIL=${{ secrets.FROM_EMAIL }}
            SMTP_SERVER=${{ secrets.SMTP_SERVER }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            # Slack（任意）
            SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
            SLACK_CHANNEL_ID=${{ secrets.SLACK_CHANNEL_ID }}
            # 画像をそのまま添付（1なら画像、0ならZIP）
            MAIL_ATTACH_IMAGES=1
            # タイムゾーン
            TZ=Asia/Tokyo

      # ===== その場で1回実行（検証用）=====
      - name: Execute Akita Job now
        run: |
          gcloud run jobs execute akita-panels \
            --region "${{ env.REGION }}" \
            --wait \
            --format json
