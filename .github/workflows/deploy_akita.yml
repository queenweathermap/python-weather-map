name: Deploy Akita Job

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/**"
      - "module/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy_akita.yml"
  workflow_dispatch: {}
  # （任意）定期デプロイが要る場合はコメントアウトを外す
  # schedule:
  #   - cron: "0 3 * * *"  # 12:00 JST = 03:00 UTC

concurrency:
  group: deploy-akita-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPO }}/akita-panels:latest
      REGION: ${{ secrets.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4

      # --- GCP 認証 ---
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # --- Build & Push（Artifact Registry）---
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and Push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # --- Cloud Run Job（Akita）を最新イメージに更新 ---
      # ここでは“イメージ差し替え”とリソース設定のみ。コマンド／引数／環境変数は
      # Console 側（ジョブ設定）に保持しておきます。
      - name: Deploy Akita Job
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          job: akita-panels
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          flags: >-
            --cpu=4
            --memory=16Gi
            --task-timeout=3600
            --max-retries=1
