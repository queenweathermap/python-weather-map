name: Run Promo WxChart (monthly)

on:
  # 準備が整うまで一時休止中（2026-08-09）。再開する際はこのコメントアウトを戻す。
  # schedule:
  #   # 毎月10日 09:00 JST（00:00 UTC）
  #   - cron: "0 0 10 * *"

  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # R2（build_dashboard_jma_only/build_layout4_only が内部で参照。
      #   このジョブ自体はThreadsの公開URL化にのみ使う）
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "promo-wxchart"
      R2_RETENTION_DAYS: "30"
      R2_CLEANUP_DRY_RUN: "0"

      # ------------------------------------------------------------
      # PDF / PNG設定（週間4列・全部入りの内部レンダリングで使用）
      # ------------------------------------------------------------
      PDF_DPI: "220"
      JPEG_DPI: "220"
      JPEG_QUALITY: "85"
      PNG_OPTIMIZE: "1"
      DISCORD_THUMB_MAX_WIDTH: "1200"

      # ------------------------------------------------------------
      # Bluesky（climate-akita と同じアカウント）
      # ------------------------------------------------------------
      BLUESKY_ENABLE: "1"
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

      # ------------------------------------------------------------
      # Threads（climate-akita と同じアカウント）
      # ------------------------------------------------------------
      THREADS_ENABLE: "1"
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow pdf2image boto3 notion-client

      - name: Run Promo WxChart (3枚まとめ投稿)
        run: |
          python scripts/promo_wxchart.py

      - name: Cleanup old R2 objects
        if: always()
        run: |
          python scripts/r2_cleanup.py
