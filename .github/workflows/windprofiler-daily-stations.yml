name: Run JMA Windprofiler (Daily Station Summary)

on:
  schedule:
    # JST 03:00（前日分の4回が出そろった翌日に、前日分をまとめて配信する）
    # UTC 18:00（前日）。他のワークフローと重複しない時刻。
    # 観測データは多少遅れても実害が小さいため、GitHub Actions自体のscheduleに
    # 戻す(Cloudflare Worker側でcronを後から追加編集した際、その追加分だけ
    # 丸一日発火しない不具合が実際に起きたため、予測図系だけWorker側に残し、
    # 観測データ系はこちらに戻した)。
    - cron: "0 18 * * *"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # jma-windprofilerチャンネルへのDiscord投稿は、合成画像が日によって
      # Discordのファイルサイズ上限(413)を超えて失敗することがあり配信の
      # 主軸ではなくなったため2026-09-16付けで廃止した（チャンネル自体も
      # 削除済み）。
      #
      # 有料配信（PWA/メールログイン購読者へのOneSignal Push）
      # ------------------------------------------------------------
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_SUBSCRIBERS_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBERS_DATABASE_ID }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}

      # ------------------------------------------------------------
      # Notion資料アーカイブ（R2の保存期限が切れても内容が残るよう、前日分
      # グリッド画像をNotion管理ストレージへ永久インポートする。2026-09-16追加）
      # ------------------------------------------------------------
      NOTION_ENABLE: "1"
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_IMPORT_IMAGES: "1"
      NOTION_IMPORT_TIMEOUT_SECONDS: "240"
      NOTION_IMPORT_POLL_SECONDS: "2.0"
      NOTION_PROP_TITLE: "名前"
      NOTION_PROP_CATEGORY: "区分"
      NOTION_PROP_INIT_JST: "配信日時"
      NOTION_PROP_MEMO: "メモ"
      NOTION_PROP_R2URL: "R2 URL"
      NOTION_PROP_AUTOGEN: "自動生成"

      # ------------------------------------------------------------
      # R2（main()と同じバケット・prefixを共有し、地点別rawの保存/読み出しに使う）
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "windprofiler"
      R2_RETENTION_DAYS: "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow boto3

      - name: Run JMA Windprofiler Daily Station Summary
        run: |
          python scripts/windprofiler_daily_stations.py
