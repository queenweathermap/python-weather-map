name: Run JMA Windprofiler (Daily Station Summary)

on:
  schedule:
    # JST 18:35（その日最後の定期実行 18:15 の後、1日1回だけ）
    # UTC 09:35
    - cron: "35 9 * * *"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # Discord（自分用チャンネル。購読者向けjma-windprofilerとは別webhook。
      # DMではなく通常のチャンネル投稿）
      # ------------------------------------------------------------
      DISCORD_WINDPROFILER_DAILY_WEBHOOK_URL: ${{ secrets.DISCORD_WINDPROFILER_DAILY_WEBHOOK_URL }}

      # ------------------------------------------------------------
      # R2（main()と同じバケット・prefixを共有し、地点別rawの保存/読み出しに使う）
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "windprofiler"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow boto3

      - name: Run JMA Windprofiler Daily Station Summary
        run: |
          python scripts/windprofiler_daily_stations.py
