name: Run JMA Windprofiler (Daily Station Summary)

on:
  # JST 03:00（前日分の4回が出そろった翌日に、前日分をまとめて配信する）
  # GitHub Actions自体のscheduleはbest-effortで遅延・欠落しうるため、
  # Cloudflare Workers「weathermap-scheduler」のcronトリガー(UTC 18:00)から
  # workflow_dispatchで起動する。
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # Discord（既存のjma-windprofilerチャンネルと同じWebhookを再利用。
      # DMではなく通常のチャンネル投稿として、前日まとめを追加投稿する）
      # ------------------------------------------------------------
      DISCORD_WINDPROFILER_WEBHOOK_URL: ${{ secrets.DISCORD_WINDPROFILER_WEBHOOK_URL }}

      # ------------------------------------------------------------
      # 有料配信（PWA/メールログイン購読者へのOneSignal Push）
      # ------------------------------------------------------------
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_SUBSCRIBERS_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBERS_DATABASE_ID }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      NOTION_PWA_HISTORY_DATABASE_ID: ${{ secrets.NOTION_PWA_HISTORY_DATABASE_ID }}

      # ------------------------------------------------------------
      # R2（main()と同じバケット・prefixを共有し、地点別rawの保存/読み出しに使う）
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "windprofiler"
      R2_RETENTION_DAYS: "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow boto3

      - name: Run JMA Windprofiler Daily Station Summary
        run: |
          python scripts/windprofiler_daily_stations.py
