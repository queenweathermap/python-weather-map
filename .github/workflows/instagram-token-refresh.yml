name: Refresh Instagram Token

on:
  schedule:
    # 毎月 5日・20日 12:30 JST（03:30 UTC）。60日失効に対し十分な余裕でトークンを延長する。
    - cron: "30 3 5,20 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      # 現在の長期ユーザートークン（このジョブが延長して同じSecretを上書きする）
      INSTAGRAM_USER_TOKEN: ${{ secrets.INSTAGRAM_USER_TOKEN }}
      # wxchart-poster アプリのID/シークレット
      META_APP_ID: "976013808792748"
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      # 細粒度PAT: このリポジトリの Secrets = Read and write 権限
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pynacl

      - name: Refresh Instagram token & update secrets
        run: |
          python scripts/refresh_instagram_token.py
