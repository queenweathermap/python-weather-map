name: JAPAN Weather Panel Split

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 7 * * *"

jobs:
  build-panels:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        part: [top, bottom]
        page_limit: [0]      # 0=全ページ（試験は 1 に）
      max-parallel: 2
      fail-fast: false
    env:
      TZ: Asia/Tokyo
      ECCODES_GRIB_THREADS: 1
      PANEL_NCOLS: "6"
      PANEL_DPI:   "110"
      PANEL_MAX_PAGES: "${{ matrix.page_limit }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-data-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese font
        run: sudo apt-get update && sudo apt-get install -y fonts-ipaexfont

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Debug repo layout
        run: |
          pwd
          ls -la
          ls -la scripts || true
          find . -maxdepth 3 -type f -name "gpv_panel_japan*"

      - name: Render ${{ matrix.part }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p output

          # 候補を順に探索（どの配置/命名でも動くように）
          SCRIPT=""
          for f in \
            "scripts/gpv_panel_japan_part.py" \
            "scripts/gpv_panel_japan_part_${{ matrix.part }}.py" \
            "scripts/split/gpv_panel_japan_part_${{ matrix.part }}.py"
          do
            if [ -f "$f" ]; then SCRIPT="$f"; break; fi
          done

          if [ -z "${SCRIPT:-}" ]; then
            echo "❌ gpv_panel_japan_part*.py が見つかりません"
            ls -la scripts || true
            find . -maxdepth 3 -type f -name "gpv_panel_japan*"
            exit 1
          fi

          echo "▶ Using script: $SCRIPT"
          PYTHONPATH=. python -u "$SCRIPT" \
            --part ${{ matrix.part }} \
            --ncols "${PANEL_NCOLS}" \
            --dpi "${PANEL_DPI}" \
            --max_pages "${PANEL_MAX_PAGES}"

          echo "Generated files:"
          ls -1 output || true

      - name: Upload artifacts (${{ matrix.part }})
        uses: actions/upload-artifact@v4
        with:
          name: jp-panels-${{ matrix.part }}
          path: |
            output/*.jpg
            output/**/*.jpg
          if-no-files-found: warn

  send:
    runs-on: ubuntu-latest
    needs: build-panels
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
      FROM_EMAIL:      ${{ secrets.FROM_EMAIL }}
      TO_EMAIL:        ${{ secrets.TO_EMAIL }}
      SMTP_SERVER:     ${{ secrets.SMTP_SERVER }}
      SMTP_PORT:       ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME:   ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
      MAIL_SUBJECT_PREFIX: "[Japan]"
      MAIL_ATTACH_AS_ZIP: ${{ vars.MAIL_ATTACH_AS_ZIP || '0' }}
      SLACK_BOT_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements (minimal)
        run: pip install -r requirements.txt

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_outputs

      - name: Send one email (or Slack)
        env:
          AGGREGATE_DIR: all_outputs
        run: |
          PYTHONPATH=. python -u scripts/aggregate_and_send.py
