# .github/workflows/weather_local.yml
# ===============================================
# Local Weather Panel Generator（任意地点・手動トリガー）
# ===============================================

name: Local Weather Panel

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'データ種別（gsm or msm）'
        required: true
        default: 'msm'
        type: choice
        options:
          - gsm
          - msm
      city:
        description: '地名（例：Nagaoka Fireworks）'
        required: true
        type: string
      pin_lat:
        description: 'ピンポイント緯度（例：37.4462）'
        required: true
        type: number
      pin_lon:
        description: 'ピンポイント経度（例：138.8521）'
        required: true
        type: number
      range_width:
        description: '中心からの半径（度, デフォルト2.5）'
        required: false
        default: 2.5
        type: number

jobs:
  run-local-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Install Japanese font (IPAexGothic)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ipaexfont

      - name: Run Local Weather Panel Script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python3 gpv_panel_daily_local.py \
            --model "${{ github.event.inputs.model }}" \
            --city "${{ github.event.inputs.city }}" \
            --pin_lat ${{ github.event.inputs.pin_lat }} \
            --pin_lon ${{ github.event.inputs.pin_lon }} \
            --range_width ${{ github.event.inputs.range_width }}
