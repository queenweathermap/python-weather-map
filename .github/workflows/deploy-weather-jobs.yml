      #   run: gcloud run jobs execute akita-panels --region="${{ env.REGION }}" --wait --format=json
      # - name: Smoke run JMA job once
      #   run: gcloud run jobs execute weathercaster-jma --region="${{ env.REGION }}" --wait --format=json
