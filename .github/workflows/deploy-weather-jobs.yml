# .github/workflows/deploy-weather-jobs.yml
name: Deploy Weather Jobs (Akita & JMA)

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/**"
      - "module/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy-weather-jobs.yml"
  workflow_dispatch: {}

# 並走ビルドを避けて安全に
concurrency:
  group: deploy-weather-jobs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPO }}/akita-panels:latest
      REGION: ${{ secrets.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4

      # 認証
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Artifact Registry にログイン → Build & Push
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and Push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Akita ジョブを最新イメージに更新
      - name: Update Akita Job to latest image
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          job: akita-panels
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          flags: >-
            --args="scripts/gpv_panel_daily_akita.py"
            --memory=16Gi
            --cpu=4
            --max-retries=1
            --task-timeout=3600

      # JMA ジョブを最新イメージに更新
      - name: Update JMA Job to latest image
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          job: weathercaster-jma
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          flags: >-
            --args="scripts/weathercaster_jma.py"
            --memory=16Gi
            --cpu=4
            --max-retries=1
            --task-timeout=3600


      # （任意）デプロイ後スモーク実行：成功/失敗をCIで検知したい場合に有効化
