name: Weathercaster Slack Notify

on:
  schedule:
    - cron: '0 4 * * *'  # 日本時間13:00（UTC+9）
  workflow_dispatch:

jobs:
  notify-weathercaster:
    runs-on: ubuntu-latest

    env:
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Run Weathercaster Slack Notify Script
        run: python daily_weathercaster_notify.py
