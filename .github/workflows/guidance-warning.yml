name: Akita Guidance Warning

on:
  schedule:
    - cron: "0 * * * *"   # 毎時（GSMの新しい初期時刻を拾う。GitHub側都合で遅延あり）
  workflow_dispatch:

permissions:
  contents: write          # 状態ファイルをコミットして戻すため

concurrency:
  group: guidance-warning
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run guidance warning
        env:
          DISCORD_GUIDANCE_WEBHOOK_URL: ${{ secrets.DISCORD_GUIDANCE_WEBHOOK_URL }}
          JMA_ADV_USER: ${{ secrets.JMA_ADV_USER }}
          JMA_ADV_PASS: ${{ secrets.JMA_ADV_PASS }}
          STATE_FILE: "data/guidance_warning_state.json"
          # 任意の上書き（既定: filter0 / 1h=20 3h=30 24h=50 / 秋田=05*）
          # GUID_FILTER: "filter0"
          # GUID_RAIN1_MM: "20"
          # GUID_RAIN3_MM: "30"
          # GUID_RAIN24_MM: "50"
          # GUID_ELEMENTS: "rain1,rain3,rain24"
        run: python module/jobs/guidance_warning.py

      - name: Commit state
        run: |
          git add -f data/guidance_warning_state.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "update guidance warning state [skip ci]"
            git push
          fi
