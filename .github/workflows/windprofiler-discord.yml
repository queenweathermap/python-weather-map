name: Run JMA Windprofiler

on:
  schedule:
    # JST 00:15 / 06:15 / 12:15 / 18:15（6時間おき。サイト表示は約7時間分の
    # ローリングウィンドウのため、約1時間の重なりで1日を切れ目なくカバーする）
    # UTC 15:15(前日) / 21:15(前日) / 03:15 / 09:15
    - cron: "15 3,9,15,21 * * *"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # Discord（jma-windprofiler専用チャンネル）
      # ------------------------------------------------------------
      DISCORD_WINDPROFILER_WEBHOOK_URL: ${{ secrets.DISCORD_WINDPROFILER_WEBHOOK_URL }}

      # ------------------------------------------------------------
      # 有料DM配信（正午の回のみ。emagram/guidance系と同じ購読者管理）
      # ------------------------------------------------------------
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_SUBSCRIBERS_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBERS_DATABASE_ID }}

      # ------------------------------------------------------------
      # R2
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "windprofiler"
      R2_RETENTION_DAYS: "30"
      R2_CLEANUP_DRY_RUN: "0"

      # ------------------------------------------------------------
      # スクリーンショット設定
      # ------------------------------------------------------------
      WINDPROFILER_VIEWPORT_WIDTH: "1050"
      WINDPROFILER_VIEWPORT_HEIGHT: "760"
      WINDPROFILER_WAIT_MS: "1200"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow playwright boto3

      - name: Get installed Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pip show playwright | grep Version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium

      - name: Run JMA Windprofiler
        run: |
          python scripts/windprofiler_discord.py

      - name: Cleanup old R2 objects
        if: always()
        run: |
          python scripts/r2_cleanup.py
