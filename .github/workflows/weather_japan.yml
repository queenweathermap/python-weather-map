# ===============================================
# JAPAN Weather Panel (Matrix Split, Mail + Slack)
# 全国 GSM/MSM ハイブリッド：各予報時刻ごとに並列実行
# 保存なし（ZIPをメールで送付）／Slackは任意
# ===============================================

name: JAPAN Weather Panel

on:
  # schedule:
  #   - cron: "0 6 * * *"   # JST 15:00（UTC 06:00）
  workflow_dispatch:

jobs:
  run-japan-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      # ---- Mail (必須) ----
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO:   ${{ secrets.MAIL_TO }}
      MAIL_SUBJECT_PREFIX: "[Japan]"
      # ---- Slack (任意) ----
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    strategy:
      matrix:
        forecast_hour: [0, 3, 6, 9, 12, 15, 18, 21, 24, 27, 30]
      max-parallel: 2
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Cartopy data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-data-v1

      - name: Install Japanese font (IPAexGothic)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ipaexfont

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Japan Weather Panel Script (each forecast hour)
        env:
          FORECAST_HOUR: ${{ matrix.forecast_hour }}
        run: |
          echo "[INFO] forecast_hour=$FORECAST_HOUR"
          PYTHONPATH=. python scripts/gpv_panel_daily_japan.py --forecast_hour "$FORECAST_HOUR"
