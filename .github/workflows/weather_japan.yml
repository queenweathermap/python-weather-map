# .github/workflows/weather_japan.yml
# ===============================================
# 全国GSM/MSMハイブリッド天気図パネル自動生成（Slack・Drive連携）
# 2025-06-27 リファクタ
# ===============================================

name: JAPAN Weather Panel

on:
  schedule:
    - cron: '0 4 * * *'   # JST 13時
  workflow_dispatch:

jobs:
  run-japan-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Japan Weather Panel Script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python3 scripts/gpv_panel_daily_japan.py
