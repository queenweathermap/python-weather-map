# ===============================================
# JAPAN Weather Panel (Matrix Split, Mail + Slack, Artifact Aggregate)
# 全国 GSM/MSM ハイブリッド：各予報時刻ごとに並列生成 → 最後に1通で送信
# ===============================================

name: JAPAN Weather Panel

on:
  # schedule:
  #   - cron: "0 6 * * *"  # JST 15:00（UTC 06:00）
  workflow_dispatch:

jobs:
  # 1) 画像生成（並列）
  run-japan-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      # ---- Mail/Slack はここでは使わない（最終ジョブで使用） ----

    strategy:
      matrix:
        forecast_hour: [0, 3, 6, 9, 12, 15, 18, 21, 24, 27, 30]
      max-parallel: 2
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Cartopy Data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-data-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese font (IPAexGothic)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ipaexfont

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Japan Weather Panel Script (each forecast hour)
        env:
          FORECAST_HOUR: ${{ matrix.forecast_hour }}
        run: |
          echo "[INFO] forecast_hour=$FORECAST_HOUR"
          # スクリプト側は「描画→output/へ保存するだけ」。メール/Slackはしない。
          PYTHONPATH=. python scripts/gpv_panel_daily_japan.py --forecast_hour "$FORECAST_HOUR"

      - name: Upload artifacts (this fh)
        uses: actions/upload-artifact@v4
        with:
          name: jp-panels-fh-${{ matrix.forecast_hour }}
          path: |
            output/**/*.jpg
            output/**/*.png
          if-no-files-found: ignore

  # 2) 集約して1通送信（依存）
  aggregate-and-send:
    runs-on: ubuntu-latest
    needs: run-japan-panel
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
      # ---- Mail（統一名）----
      FROM_EMAIL:      ${{ secrets.FROM_EMAIL }}
      TO_EMAIL:        ${{ secrets.TO_EMAIL }}
      SMTP_SERVER:     ${{ secrets.SMTP_SERVER }}
      SMTP_PORT:       ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME:   ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
      MAIL_SUBJECT_PREFIX: "[Japan]"
      # 画像をZIPにしたい場合は 1 に
      MAIL_ATTACH_AS_ZIP: ${{ vars.MAIL_ATTACH_AS_ZIP || '0' }}
      # ---- Slack（任意） ----
      SLACK_BOT_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements (minimum)
        run: pip install -r requirements.txt

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_outputs   # ← ここに全部展開

      - name: Aggregate and send one mail
        env:
          AGGREGATE_DIR: all_outputs
        run: |
          PYTHONPATH=. python scripts/aggregate_and_send.py
