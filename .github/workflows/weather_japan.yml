# ===============================================
# JAPAN Weather Panel (One-shot, Mail + Slack)
# 全国 GSM/MSM ハイブリッド：全stepを1回で生成 → 1通で送信
# 保存なし運用（ローカル出力はジョブ終了時に破棄）
# ===============================================

name: JAPAN Weather Panel

on:
  # schedule:
  #   - cron: "0 6 * * *"   # JST 15:00（UTC 06:00）
  workflow_dispatch:

jobs:
  run-japan-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo

      # ---- Mail（統一名）----
      FROM_EMAIL:      ${{ secrets.FROM_EMAIL }}
      TO_EMAIL:        ${{ secrets.TO_EMAIL }}
      SMTP_SERVER:     ${{ secrets.SMTP_SERVER }}
      SMTP_PORT:       ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME:   ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
      MAIL_SUBJECT_PREFIX: "[Japan]"

      # ---- Slack（任意） ----
      SLACK_BOT_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Cartopy Data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-data-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese font (IPAexGothic)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ipaexfont

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Japan Weather Panel Script (one-shot)
        run: |
          echo "[INFO] start one-shot run"
          PYTHONPATH=. python scripts/gpv_panel_daily_japan.py
