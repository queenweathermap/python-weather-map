# ============================================================
# JMA 防災情報アドバイザー向け
# 専門天気図（tgv）を自動取得してメール送信する Workflow
#
# ・GitHub Actions 上で実行
# ・Safariで確認した Authorization: Basic を使用
# ・個人利用・非公開前提
# ============================================================

name: Send TGV Special Maps

# ------------------------------------------------------------
# 実行トリガー
# ------------------------------------------------------------
on:
  # 定期実行（cron）
  # GitHub Actions の cron は「UTC」基準
  # 10 5 * * * ＝ UTC 05:10 → JST 14:10
  schedule:
    - cron: "10 5 * * *"

  # 手動実行（Actions 画面から Run workflow）
  workflow_dispatch: {}

# ------------------------------------------------------------
# 多重起動防止
# 同じブランチで前のジョブが動いていたらキャンセル
# ------------------------------------------------------------
concurrency:
  group: send-tgv-maps-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------------------------------------
# ジョブ定義
# ------------------------------------------------------------
jobs:
  send_tgv_maps:
    # 実行環境（GitHub Actions 標準）
    runs-on: ubuntu-latest

    # --------------------------------------------------------
    # 環境変数
    # （Python スクリプトから os.getenv() で参照される）
    # --------------------------------------------------------
    env:
      # タイムゾーン（datetime.now() の表示を JST にするため）
      TZ: Asia/Tokyo

      # Python の標準出力をバッファリングしない
      # → Actions のログに即時表示され、デバッグしやすい
      PYTHONUNBUFFERED: "1"

      # ======================================================
      # メール送信設定（既存 run_jma.yml と共通）
      # ======================================================
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}

      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      # メール件名の先頭に付ける文字列
      EMAIL_SUBJECT_PREFIX: "JMA"

      # ======================================================
      # ★ 認証情報（最重要）★
      # ======================================================

      # --- 優先的に使われる ---
      # 気象防災アドバイザー（adv）用の ID / パスワード
      # Python 側で Authorization: Basic xxxx を毎回生成する
      JMA_ADV_USER: ${{ secrets.JMA_ADV_USER }}
      JMA_ADV_PASS: ${{ secrets.JMA_ADV_PASS }}

      # --- フォールバック用 ---
      # Safari の Network タブで実測した
      # Authorization: Basic xxxx をそのまま入れたもの
      # （USER/PASS が未設定の場合にのみ使用）
      JMA_AUTH_BASIC: ${{ secrets.JMA_AUTH_BASIC }}


    # --------------------------------------------------------
    # 実行ステップ
    # --------------------------------------------------------
    steps:
      # リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python 環境をセットアップ
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 必要最小限の依存関係をインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 専門天気図を取得してメール送信
      - name: Run TGV map sender script
        run: python scripts/adv_jma.py
