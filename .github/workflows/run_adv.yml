# .github/workflows/run_adv.yml
name: Run ADV JMA

on:
  schedule:
    - cron: "10 5 * * *"   # UTC（JST 14:10）
  workflow_dispatch: {}

concurrency:
  group: run-adv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_adv:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"

      # =====================
      # Mail（mail_utils参照）
      # =====================
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_SUBJECT_PREFIX: "JMA"
      SMTP_STARTTLS: "1"
      MAIL_DEBUG: "0"
      MAX_MAIL_SIZE_MB: "20"

      # =====================
      # JMA ADV 認証
      # =====================
      JMA_ADV_USER: ${{ secrets.JMA_ADV_USER }}
      JMA_ADV_PASS: ${{ secrets.JMA_ADV_PASS }}
      JMA_AUTH_BASIC: ${{ secrets.JMA_AUTH_BASIC }}

      # =====================
      # Slack（副系：入っていれば使う）
      # =====================
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_CHUNK: "10"

      # =====================
      # ADV script tuning
      # =====================
      DELIVERY_MODE: "both"        # email | slack | both
      JPG_QUALITY: "85"
      INIT_SEARCH_HOURS: "72"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # adv_jma.py は PIL を使うので pillow 必須
            pip install requests pillow
          fi

      - name: Run ADV script
        run: |
          python scripts/adv_jma.py
