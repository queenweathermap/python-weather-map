name: Akita Weather Warning

on:
  schedule:
    # 5時・11時・17時 JST（= UTC 20/2/8時）
    - cron: "15 2,8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-warning
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix broken Microsoft apt repos
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update -qq || true

      - name: Install Japanese fonts
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install playwright pillow

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Send weather screenshots
        env:
          DISCORD_WARNING_WEBHOOK_URL: ${{ secrets.DISCORD_WARNING_WEBHOOK_URL }}
          # JMAアメダス(鷹巣・秋田・横手)もこのチャンネルへ同じ時刻に投稿する
          # (module/jobs/weather_warning.py::post_amedas_detail、2026-09-16追加)。
          # R2/Notionへの保存はscripts/wcn_amedas.py側(朝6/12/18時)で別途行って
          # いるため、ここではDiscord投稿のみに絞りR2アップロードを無効化する。
          R2_ENABLE: "0"
        run: python module/jobs/weather_warning.py
