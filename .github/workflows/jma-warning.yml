name: Akita Weather Warning

on:
  schedule:
    # 5時・11時・17時 JST（= UTC 20/2/8時）
    - cron: "15 2,8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-warning
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix broken Microsoft apt repos
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update -qq || true

      - name: Install Japanese fonts
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install playwright pillow boto3 notion-client

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Send weather screenshots
        env:
          DISCORD_WARNING_WEBHOOK_URL: ${{ secrets.DISCORD_WARNING_WEBHOOK_URL }}
          # JMAアメダス(鷹巣・秋田・横手)もこのチャンネルへ同じ時刻に投稿する
          # (module/jobs/weather_warning.py::post_amedas_detail、2026-09-16追加)。
          # Discordと同じ内容をNotionにも1件アーカイブする(2026-09-18変更。
          # 従来はscripts/wcn_amedas.py側(朝6/12/18時)がR2/Notionを担当して
          # いたが、Discord投稿内容と記録内容を一致させるためこちらに一本化した)。
          R2_ENABLE: "1"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
          R2_PREFIX: "jma-warning"
          R2_RETENTION_DAYS: "21"
          R2_CLEANUP_DRY_RUN: "0"
          NOTION_ENABLE: "1"
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_IMPORT_IMAGES: "1"
          NOTION_IMPORT_TIMEOUT_SECONDS: "240"
          NOTION_IMPORT_POLL_SECONDS: "2.0"
        run: python module/jobs/weather_warning.py

      - name: Cleanup old R2 objects
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: "jma-warning"
          R2_RETENTION_DAYS: "21"
          R2_CLEANUP_DRY_RUN: "0"
        run: python scripts/r2_cleanup.py
