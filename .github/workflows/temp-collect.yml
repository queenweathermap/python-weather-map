name: TEMP collect (JMA upper-air bulletins via NWS tgftp)

# tgftp は同名ファイルへ最新電文を上書きするため、観測(00Z/12Z)の発信が
# 続く時間帯だけ5分おきに取得し、更新分をR2(emagram/temp_raw/)へ蓄積する。
# 配信側(temp-stuve.yml)がこの蓄積から合成する。
# 発信時間帯: 00Z観測→UTC 0〜5時 / 12Z観測→UTC 12〜17時。
# GitHub Actions の schedule は数分〜十数分遅れることがある(取りこぼしの要因)。
on:
  schedule:
    - cron: "*/5 0-5,12-17 * * *"
  workflow_dispatch:

concurrency:
  group: temp-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "emagram"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-temp.txt

      - name: Install dependencies
        run: pip install -r requirements-temp.txt

      - name: Collect
        run: python scripts/temp_collect.py
