name: Emagram (University of Wyoming)

on:
  schedule:
    # JST 16:00 / 翌04:00（00Z=09時JST・12Z=21時JST観測の7時間後）
    # データ反映が遅い地点(例: 南大東島)を拾えるよう、5時間後から2時間後ろ倒し。
    # UTC 07:00 / 19:00
    - cron: "0 7,19 * * *"

  workflow_dispatch:

jobs:
  post-emagram:
    runs-on: ubuntu-latest

    env:
      DISCORD_EMAGRAM_WEBHOOK_URL: ${{ secrets.DISCORD_EMAGRAM_WEBHOOK_URL }}

      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "emagram"
      R2_RETENTION_DAYS: "30"
      R2_CLEANUP_DRY_RUN: "0"

      # ------------------------------------------------------------
      # 有料DM配信
      # ------------------------------------------------------------
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_SUBSCRIBERS_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBERS_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese fonts
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install requests pillow boto3

      - name: Post emagram
        run: python scripts/emagram_discord.py

      - name: Cleanup old R2 objects
        if: always()
        run: python scripts/r2_cleanup.py
