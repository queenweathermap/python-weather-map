name: Emagram (University of Wyoming)

on:
  # 12Z配信に一本化した「前日まとめ」。JST 翌04:00（21時JST=12Z観測の7時間後）。
  # この時点で同日00Z(19時間経過)・12Z(7時間経過)ともに収録済みのため、
  # 1回の実行で両方を1地点=1組(00Z/12Z横並び)としてまとめて配信する。
  # データ反映が遅い地点(例: 南大東島)を拾えるよう、5時間後から2時間後ろ倒し。
  # GitHub Actions自体のscheduleはbest-effortで遅延・欠落しうるため、
  # Cloudflare Workers「weathermap-scheduler」のcronトリガー(UTC 19:00)から
  # workflow_dispatchで起動する。
  workflow_dispatch:

jobs:
  post-emagram:
    runs-on: ubuntu-latest

    env:
      DISCORD_EMAGRAM_WEBHOOK_URL: ${{ secrets.DISCORD_EMAGRAM_WEBHOOK_URL }}

      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "emagram"
      R2_RETENTION_DAYS: "30"
      R2_CLEANUP_DRY_RUN: "0"

      # ------------------------------------------------------------
      # 有料配信（PWA/メールログイン購読者へのOneSignal Push）
      # Discord DMは2026-08-19付けで停止（有料購読はPWA配信のみに一本化）。
      # 当面はコードを残し、必要なら DISCORD_DM_ENABLE: "1" を追加するだけで
      # 再開できるようにしてある。のちに正式に廃止・削除する予定。
      # ------------------------------------------------------------
      DISCORD_DM_ENABLE: "0"
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_SUBSCRIBERS_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBERS_DATABASE_ID }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      NOTION_PWA_HISTORY_DATABASE_ID: ${{ secrets.NOTION_PWA_HISTORY_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese fonts
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install requests pillow boto3

      - name: Post emagram
        run: python scripts/emagram_discord.py

      - name: Cleanup old R2 objects
        if: always()
        run: python scripts/r2_cleanup.py
