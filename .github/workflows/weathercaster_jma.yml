name: Weathercaster JMA

on:
  # schedule:
  #   - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      FROM_EMAIL:      ${{ secrets.FROM_EMAIL }}
      TO_EMAIL:        ${{ secrets.TO_EMAIL }}
      SMTP_SERVER:     ${{ secrets.SMTP_SERVER }}
      SMTP_PORT:       ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME:   ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
      MAIL_SUBJECT_PREFIX: "[Weathercaster]"
      SLACK_BOT_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cartopy Data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-data-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Run Weathercaster script
        run: PYTHONPATH=. python scripts/weathercaster_jma.py
