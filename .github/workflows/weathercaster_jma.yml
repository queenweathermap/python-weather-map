name: Weathercaster JMA

on:
  schedule:
   - cron: '0 6 * * *'   # JST 15時
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}
      WEATHERCASTER_DRIVE_FOLDER_ID: ${{ secrets.WEATHERCASTER_DRIVE_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
         python -m pip install --upgrade pip
         pip install -r requirements.txt
         sudo apt-get update
          sudo apt-get install -y poppler-utils


      - name: Run weathercaster notify
        run: PYTHONPATH=. python scripts/weathercaster_jma.py
