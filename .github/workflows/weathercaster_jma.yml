#.github/workflows/weathercaster_jma.yml

name: Weathercaster JMA

on:
   # schedule:
    # 毎日 13:30 JST = 04:30 UTC
    #  - cron: "30 4 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      FROM_EMAIL:         ${{ secrets.FROM_EMAIL }}
      TO_EMAIL:           ${{ secrets.TO_EMAIL }}
      SMTP_SERVER:        ${{ secrets.SMTP_SERVER }}
      SMTP_PORT:          ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME:      ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
      MAIL_SUBJECT_PREFIX: "[Weathercaster]"
      SLACK_BOT_TOKEN:    ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID:   ${{ secrets.SLACK_CHANNEL_ID }}
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}
      # 全ページJPG添付したい時は "1"
      MAIL_ATTACH_ALL_PAGES: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (poppler) and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pdf2image pillow

      - name: Run Weathercaster script
        run: PYTHONPATH=. python scripts/weathercaster_jma.py
