# ===============================================
# Weathercaster JMA (Mail + Slack)
# 会員ページの天気図PDFをDL→ZIP（メモリ）→メール添付
# 保存しない運用。Slackは任意通知。
# ===============================================

name: Weathercaster JMA

on:
  # schedule:
  #   - cron: "5 6,12,18,0 * * *"  # JST 15:05/21:05/03:05/09:05 など
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      # ---- Weathercaster Basic Auth ----
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}
      # ---- Mail (必須) ----
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO:   ${{ secrets.MAIL_TO }}
      MAIL_SUBJECT_PREFIX: "[Weathercaster]"
      # ---- Slack (任意) ----
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weathercaster script
        run: |
          PYTHONPATH=. python scripts/daily_weathercaster_notify.py
