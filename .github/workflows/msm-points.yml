name: Run MSM Points (会員向け MSM 数値予報)

on:
  schedule:
    # MSMは3時間ごと(00,03,...,21 UTC初期値)。京都大学のアーカイブに載るまでの遅れを見込み、
    # 3時間ごとに確認して、新しい初期時刻があるときだけ処理する(同じ初期時刻ならスキップ)。
    - cron: "25 */3 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "同じ初期時刻でも作り直す(1)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo
      # R2: 会員ページ(PWA)が読むJSONの置き場所。公開URLは https://dl.177chart.com/msm-points/...
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "msm-points"
      MSM_POINTS_KEEP_INITS: "2"
      MSM_POINTS_FORCE: ${{ github.event.inputs.force }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pygrib numpy boto3

      - name: Run MSM Points
        run: |
          python scripts/msm_points.py
