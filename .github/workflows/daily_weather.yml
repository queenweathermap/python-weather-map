# .github/workflows/weather_map.yml
# ===============================
# GitHub Actions用：天気図自動作成＆Slack通知ワークフロー
# 毎日JST 5時/17時 & 手動実行対応
# ===============================
name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'  # JST 5時
    - cron: '0 8 * * *'   # JST 17時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install wgrib2
        run: |
          sudo apt-get update
          sudo apt-get install -y wgrib2
          wgrib2 -V
