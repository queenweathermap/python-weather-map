# .github/workflows/weather_map.yml
# ===============================
# GitHub Actions用：天気図自動作成＆Slack通知ワークフロー
# 毎日JST 5時/17時 & 手動実行対応
# ===============================
name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'  # JST 5時
    - cron: '0 8 * * *'   # JST 17時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install wgrib2
        run: |
          wget https://www.ftp.cpc.ncep.noaa.gov/wd51we/wgrib2/wgrib2.tgz
          tar xzf wgrib2.tgz
          echo "===== grib2ディレクトリ内確認 ====="
          ls -lR grib2
          echo "===== バイナリのfile確認 ====="
          file grib2/wgrib2 || echo "fileコマンド失敗"
          echo "===== /usr/local/binへのmv ====="
          sudo mv grib2/wgrib2 /usr/local/bin/wgrib2
          sudo chmod +x /usr/local/bin/wgrib2
          ls -l /usr/local/bin/wgrib2
          echo "===== ldd（依存ライブラリ確認）====="
          ldd /usr/local/bin/wgrib2 || echo "ldd失敗"
          echo "===== which wgrib2 ====="
          which wgrib2 || echo "which失敗"
          echo "===== wgrib2 -V ====="
          wgrib2 -V || echo "実行不可"
