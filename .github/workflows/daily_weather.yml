# .github/workflows/weather_map.yml

name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'  # JST 5時
    - cron: '0 8 * * *'   # JST 17時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t weather-map-app .

      - name: Run weather batch in Docker
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          docker run --rm \
            -e SLACK_BOT_TOKEN="${SLACK_BOT_TOKEN}" \
            weather-map-app
