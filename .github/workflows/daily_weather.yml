# .github/workflows/weather_map.yml
# ===============================
# GitHub Actions用：天気図自動作成＆Slack通知ワークフロー
# 毎日JST 5時/17時 & 手動実行対応
# ===============================

name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'  # JST 5時
    - cron: '0 8 * * *'   # JST 17時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install wgrib2
        run: |
          wget https://www.ftp.cpc.ncep.noaa.gov/wd51we/wgrib2/wgrib2.tgz
          tar xzf wgrib2.tgz
          sudo mv wgrib2/wgrib2 /usr/local/bin/
          wgrib2 -V

      # =========================
      # ↓★★★ここが「自動ダウンロード」★★★
      # =========================
      - name: Download latest GSM GPV file
        run: |
          mkdir -p data
          BASE_URL="https://database.rish.kyoto-u.ac.jp/arch/jmadata/data/gpv/original"
          # 今日の日付（JSTでUTC+9換算）
          JST=$(date -u -d '+9 hours' '+%Y%m%d')
          YEAR=$(date -u -d '+9 hours' '+%Y')
          MONTH=$(date -u -d '+9 hours' '+%m')
          DAY=$(date -u -d '+9 hours' '+%d')
          for H in 18 12 06 00; do
            FNAME="Z__C_RJTD_${JST}${H}0000_GSM_GPV_Rgl_FD0000_grib2.bin"
            URL="${BASE_URL}/${YEAR}/${MONTH}/${DAY}/${FNAME}"
            echo "Trying: $URL"
            if wget -O "data/$FNAME" "$URL"; then
              echo "Downloaded: $FNAME"
              break
            fi
          done

      - name: Convert GRIB2 to NetCDF
        run: |
          GRIB2_FILE=$(ls data/*.grib2.bin | sort | tail -n 1)
          NC_FILE="${GRIB2_FILE}.nc"
          echo "Converting $GRIB2_FILE to $NC_FILE"
          wgrib2 "$GRIB2_FILE" -netcdf "$NC_FILE"
          
      - name: Run weather map script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/gpv_panel_daily_gsm.py


      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install wgrib2
        run: |
          wget https://www.ftp.cpc.ncep.noaa.gov/wd51we/wgrib2/wgrib2.tgz
          tar xzf wgrib2.tgz
          ls -lR  # 展開したファイル一覧を確認
          # "wgrib2"バイナリの場所を探してインストール
          if [ -f ./wgrib2 ]; then
            sudo mv ./wgrib2 /usr/local/bin/
          elif [ -f wgrib2/wgrib2 ]; then
            sudo mv wgrib2/wgrib2 /usr/local/bin/
          elif [ -f wgrib2.tgz/wgrib2 ]; then
            sudo mv wgrib2.tgz/wgrib2 /usr/local/bin/
          else
            echo "wgrib2 binary not found"
            find . -name "wgrib2"
            exit 1
          fi
          wgrib2 -V

      
      - name: Run GPV Downloader & Weather Map Panel
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/gpv_panel_daily_gsm.py
