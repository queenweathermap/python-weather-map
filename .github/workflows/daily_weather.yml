# .github/workflows/daily_weather.yml
# ===============================================
# Daily Weather Map（Slack通知・GSM全国＋秋田局地のみ）
# -----------------------------------------------
# 毎日JST 5時/17時自動実行
# Slack APIキーはGitHub Secretsで管理
# 2025-06-16 by ChatGPT
# ===============================================

name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'  # JST 5時
    - cron: '0 8 * * *'   # JST 17時
  workflow_dispatch: {}

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --no-cache -t weather-map-app .

      - name: Run weather batch in Docker
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          docker run --rm \
            -e SLACK_BOT_TOKEN="${SLACK_BOT_TOKEN}" \
            -e SLACK_CHANNEL_ID="${SLACK_CHANNEL_ID}" \
            weather-map-app
