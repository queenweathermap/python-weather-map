# .github/workflows/weather_map.yml
# ===============================
# GitHub Actions用：天気図自動作成＆Slack通知ワークフロー
# 毎日JST 5時/17時 & 手動実行対応
# ===============================
name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'  # JST 5時
    - cron: '0 8 * * *'   # JST 17時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t weather-map-app .

      - name: Run weather batch in Docker
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: |
          docker run --rm \
            -e SLACK_TOKEN="${SLACK_TOKEN}" \
            weather-map-app
