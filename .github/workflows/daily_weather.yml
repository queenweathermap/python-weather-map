# .github/workflows/weather_map.yml
# ===============================
# GitHub Actions用：天気図自動作成＆Slack通知ワークフロー
# 毎日JST 5時/17時 & 手動実行対応
# ===============================
name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'  # JST 5時
    - cron: '0 8 * * *'   # JST 17時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          miniforge-variant: Mambaforge
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install wgrib2
        run: mamba install -c conda-forge wgrib2

      - name: Convert GRIB2 to NetCDF
        run: wgrib2 data/your_file.grib2 -netcdf data/your_file.nc
