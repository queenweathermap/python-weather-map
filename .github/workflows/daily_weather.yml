# .github/workflows/daily_weather.yml
# ===============================================
# Daily Weather Map（Slack/LINE/Drive連携）
# -----------------------------------------------
# ・毎日JST 5時/17時自動バッチ
# ・任意地点のローカルパネルも手動対応
# ・APIキー/TokenはGitHub Secretsで管理
# 2025-06-16 by ChatGPT
# ===============================================

name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'  # JST 5時
    - cron: '0 8 * * *'   # JST 17時
  workflow_dispatch:
    inputs:
      city:
        description: 'City name (for local MSM panel)'
        required: false
        default: ''
      pin_lat:
        description: 'Pin latitude (for local MSM panel)'
        required: false
        default: ''
      pin_lon:
        description: 'Pin longitude (for local MSM panel)'
        required: false
        default: ''
      lat_range:
        description: 'Latitude range (min max, e.g. "37.3 37.6")'
        required: false
        default: ''
      lon_range:
        description: 'Longitude range (min max, e.g. "138.7 139.1")'
        required: false
        default: ''
      output:
        description: 'Output filename'
        required: false
        default: ''

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --no-cache -t weather-map-app .

      - name: Run weather batch in Docker
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # メール通知等追加の場合は以下も
          # MAIL_HOST: ${{ secrets.MAIL_HOST }}
          # MAIL_PORT: ${{ secrets.MAIL_PORT }}
          # MAIL_USER: ${{ secrets.MAIL_USER }}
          # MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          # ==== 定時バッチ ====
          docker run --rm \
            -e LINE_CHANNEL_ACCESS_TOKEN="${LINE_CHANNEL_ACCESS_TOKEN}" \
            -e LINE_USER_ID="${LINE_USER_ID}" \
            -e GOOGLE_SERVICE_ACCOUNT_JSON="${GOOGLE_SERVICE_ACCOUNT_JSON}" \
            -e DRIVE_FOLDER_ID="${DRIVE_FOLDER_ID}" \
            -e SLACK_BOT_TOKEN="${SLACK_BOT_TOKEN}" \
            -e SLACK_CHANNEL_ID="${SLACK_CHANNEL_ID}" \
            weather-map-app

          # ==== 手動運用：任意地点ローカルパネル ====
          if [ ! -z "${{ github.event.inputs.city }}" ] && \
             [ ! -z "${{ github.event.inputs.pin_lat }}" ] && \
             [ ! -z "${{ github.event.inputs.pin_lon }}" ] && \
             [ ! -z "${{ github.event.inputs.lat_range }}" ] && \
             [ ! -z "${{ github.event.inputs.lon_range }}" ]; then
            docker run --rm \
              -e LINE_CHANNEL_ACCESS_TOKEN="${LINE_CHANNEL_ACCESS_TOKEN}" \
              -e LINE_USER_ID="${LINE_USER_ID}" \
              -e GOOGLE_SERVICE_ACCOUNT_JSON="${GOOGLE_SERVICE_ACCOUNT_JSON}" \
              -e DRIVE_FOLDER_ID="${DRIVE_FOLDER_ID}" \
              -e SLACK_BOT_TOKEN="${SLACK_BOT_TOKEN}" \
              -e SLACK_CHANNEL_ID="${SLACK_CHANNEL_ID}" \
              weather-map-app \
              python gpv_panel_daily_msm_local.py \
                --city "${{ github.event.inputs.city }}" \
                --pin_lat ${{ github.event.inputs.pin_lat }} \
                --pin_lon ${{ github.event.inputs.pin_lon }} \
                --lat_range ${{ github.event.inputs.lat_range }} \
                --lon_range ${{ github.event.inputs.lon_range }} \
                --output "${{ github.event.inputs.output }}"
          fi
