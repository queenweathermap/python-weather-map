# .github/workflows/daily_weather.yml
# ===============================================
# Daily Weather Map（LINE通知版：メール/Slackはコメントアウト保存）
# ===============================================

name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'  # JST 5時
    - cron: '0 8 * * *'   # JST 17時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t weather-map-app .

      - name: Run weather batch in Docker
        env:
          # Slack通知用（今後復活する場合はコメント解除）
          # SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # メール通知用（今後復活する場合はコメント解除）
          # MAIL_HOST: ${{ secrets.MAIL_HOST }}
          # MAIL_PORT: ${{ secrets.MAIL_PORT }}
          # MAIL_USER: ${{ secrets.MAIL_USER }}
          # MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          # LINE通知用（Messaging APIの設定値）
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          docker run --rm \
            -e LINE_CHANNEL_ACCESS_TOKEN="${LINE_CHANNEL_ACCESS_TOKEN}" \
            -e LINE_USER_ID="${LINE_USER_ID}" \
            weather-map-app
