# ===============================
# 毎日自動で天気図作成→Slack通知（GitHub Actions用YAML）
# ===============================
name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'   # JST 5時
    - cron: '0 8 * * *'    # JST 17時
  workflow_dispatch:

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install wgrib2
        run: |
          wget https://www.ftp.cpc.ncep.noaa.gov/wd51we/wgrib2/wgrib2.tgz
          tar xzf wgrib2.tgz
          sudo mv wgrib2/wgrib2 /usr/local/bin/
          wgrib2 -V

      - name: Run weather map script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/gpv_panel_daily_gsm.py
