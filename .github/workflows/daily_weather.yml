name: Daily Weather Map

on:
  schedule:
    - cron: '0 20 * * *'  # 5時 JST（UTC+9）
    - cron: '0 8 * * *'   # 17時 JST（UTC+9）
  workflow_dispatch:         # 手動実行も可

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weather map script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/gpv_panel_daily_gsm.py

jobs:
  run-weather-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ←★ここを追加！
      - name: Install wgrib2
        run: sudo apt-get update && sudo apt-get install -y wgrib2

      - name: Convert GRIB2 to NetCDF
        run: |
          # 必要な変換コマンドをここに書く
