name: Daily Weathercaster Email

on:
  schedule:
    - cron: '0 4 * * *'  # JST 13:00 = UTC 04:00
  workflow_dispatch:      # 手動実行も可能に

jobs:
  send-email:
    runs-on: ubuntu-latest

    env:
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_SMTP_SERVER: ${{ secrets.MAIL_SMTP_SERVER }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Run weathercaster email script
        run: python daily_weathercaster_email.py
