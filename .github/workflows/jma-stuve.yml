name: Emagram (JMA confirmed data, 2 days later)

# 気象庁「過去の気象データ検索(高層)」の確定データから、15地点のStüve線図を
# 合成して配信する(2日後配信)。emagram-discord.yml(Wyoming版)の後継で、
# 2026-11-24 に本番切替済み。Wyoming版は二重配信を避けるため schedule を外した
# (手動実行は残してある)。手動実行の既定は DRY_RUN=1(配信せずプレビューのみ)。
on:
  schedule:
    - cron: "30 19 * * *"   # UTC 19:30 = JST 翌04:30(ウィンドプロファイラ04:00と30分ずらし。公開時刻の実測後に再調整予定) (JST今日の2日前の観測をまとめて配信)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1=配信せずプレビューのみ / 0=本番配信"
        default: "1"
      target_date:
        description: "対象日(JST, YYYYMMDD)。空ならJST今日の2日前"
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest

    env:
      # 定期実行(schedule)は本番配信(0)。手動実行は入力値(既定1=プレビューのみ)。
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run || '1') || '0' }}
      TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "emagram"
      R2_RETENTION_DAYS: "21"
      R2_CLEANUP_DRY_RUN: "0"
      DISCORD_DM_ENABLE: "0"
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_SUBSCRIBERS_DATABASE_ID: ${{ secrets.NOTION_SUBSCRIBERS_DATABASE_ID }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      NOTION_ENABLE: "1"
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_IMPORT_IMAGES: "1"
      NOTION_IMPORT_TIMEOUT_SECONDS: "240"
      NOTION_IMPORT_POLL_SECONDS: "2.0"
      NOTION_PROP_TITLE: "タイトル"
      NOTION_PROP_CATEGORY: "区分"
      NOTION_PROP_INIT_JST: "配信日時"
      NOTION_PROP_MEMO: "メモ"
      NOTION_PROP_R2URL: "R2 URL"
      NOTION_PROP_AUTOGEN: "自動生成"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-temp.txt

      - name: Install Japanese fonts
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements-temp.txt

      - name: Post emagram
        run: python scripts/jma_stuve_post.py

      - name: Upload preview (DRY_RUN only)
        if: env.DRY_RUN == '1'
        uses: actions/upload-artifact@v4
        with:
          name: jma-stuve-preview
          path: preview_out/jma_stuve.png
          retention-days: 3

      - name: Cleanup old R2 objects
        if: always()
        run: python scripts/r2_cleanup.py
