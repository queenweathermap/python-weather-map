name: Akita Weather Panel – Build & Deploy

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/**"
      - "module/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/weather_akita.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPO }}/akita-panels:latest
      JOB_NAME: akita-panels
      REGION: ${{ secrets.GCP_REGION }}

    steps:
      - uses: actions/checkout@v4

      # 認証（サービスアカウント鍵JSON）
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Artifact Registry にログイン
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      # Docker Build & Push
      - name: Build and Push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # 既存の Cloud Run Job を最新イメージに更新
      - name: Update Cloud Run Job
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          job: ${{ env.JOB_NAME }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          flags: >
            --memory=16Gi
            --cpu=4
            --max-retries=1
            --task-timeout=3600
