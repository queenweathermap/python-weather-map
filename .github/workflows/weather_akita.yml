name: Deploy Akita Job

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/**"
      - "module/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy_akita.yml"
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 3 * * *"  # 12:00 JST = 03:00 UTC

concurrency:
  group: deploy-akita-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPO }}/akita-panels:latest
      REGION: ${{ secrets.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4

      # GCP 認証
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Artifact Registry にビルド＆プッシュ
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and Push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Cloud Run Job を更新（イメージ・リソース・環境変数・コマンド/引数）
      - name: Deploy Akita Job
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          job: akita-panels
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          # 既存 Job があっても毎回上書き
          flags: >-
            --cpu=4
            --memory=16Gi
            --task-timeout=3600
            --max-retries=1
            --command=python
            --args=scripts/gpv_panel_daily_akita.py
          env_vars: |
            # パネル生成先（GCSは任意）
            GCS_BUCKET=akita-weather-panels
            # Python/Matplotlib 一時
            PYTHONPATH=/app
            MPLCONFIGDIR=/tmp/matplotlib
            TZ=Asia/Tokyo

            # メール（スクリプトは MAIL_TO を読む／ライブラリの既定対策で TO_EMAIL も並記）
            MAIL_TO=${{ secrets.TO_EMAIL }}
            TO_EMAIL=${{ secrets.TO_EMAIL }}
            FROM_EMAIL=${{ secrets.FROM_EMAIL }}
            SMTP_SERVER=${{ secrets.SMTP_SERVER }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}

            # 添付の挙動（画像をそのまま添付：1 / ZIP化：0）
            MAIL_ATTACH_IMAGES=1
            MAIL_ATTACH_AS_ZIP=0
            MAX_MAIL_SIZE_MB=23
            MAIL_SUBJECT_PREFIX=[Akita]

            # Slack 通知（Botトークン/チャンネルID）
            MAIL_SLACK_NOTIFY=1
            SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
            SLACK_CHANNEL_ID=${{ secrets.SLACK_CHANNEL_ID }}

      # デプロイ直後に 1 回実行（ログとメール到達の確認用）
      - name: Execute Akita Job now
        run: |
          gcloud run jobs execute akita-panels \
            --region "${{ env.REGION }}" \
            --wait \
            --format json
