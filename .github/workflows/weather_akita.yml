# ===============================================
# Akita Weather Panel (Mail + Slack)
# MSM 局地（エマグラム付き）。保存せずメール送付／Slackは任意
# ===============================================

name: Akita Weather Panel

on:
  # schedule:
  #   - cron: "15 6 * * *"   # JST 15:15 など任意
  workflow_dispatch:

jobs:
  run-akita-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      # ---- Mail (必須) ----
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO:   ${{ secrets.MAIL_TO }}
      MAIL_SUBJECT_PREFIX: "[Akita]"
      # ---- Slack (任意) ----
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese font (IPAexGothic)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ipaexfont

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Akita Local Weather Script
        run: |
          PYTHONPATH=. python scripts/gpv_panel_daily_akita.py
