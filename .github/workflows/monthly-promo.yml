name: Monthly Promo (全部入り天気図)

on:
  schedule:
    # 毎月10日 10:00 JST（01:00 UTC）
    - cron: "0 1 10 * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # Notion（PWA配信履歴DBから「1日 00Z」の全部入り天気図URLを検索）
      # ------------------------------------------------------------
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PWA_HISTORY_DATABASE_ID: ${{ secrets.NOTION_PWA_HISTORY_DATABASE_ID }}

      # ------------------------------------------------------------
      # Bluesky（climate-akita と同じアカウント）
      # ------------------------------------------------------------
      BLUESKY_ENABLE: "1"
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

      # ------------------------------------------------------------
      # Threads（climate-akita と同じアカウント）: 画像は公開URL(R2)から取得される
      # ------------------------------------------------------------
      THREADS_ENABLE: "1"
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

      # ------------------------------------------------------------
      # Instagram（climate-akita と同じアカウント）: 画像は公開URL(R2)から取得される
      # ------------------------------------------------------------
      INSTAGRAM_ENABLE: "1"
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

      # ------------------------------------------------------------
      # Facebook Page（177chart。Instagramと同じページ・同じトークンを使う）
      # ------------------------------------------------------------
      FACEBOOK_ENABLE: "1"
      FACEBOOK_PAGE_ID: "1265931083278703"
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

      # ------------------------------------------------------------
      # R2（Threads/Instagram公開URL用の再アップロードに必要）
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "monthly-promo"
      R2_RETENTION_DAYS: "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Post monthly dashboard promo (Bluesky/Threads/Facebook/Instagram)
        run: |
          python scripts/monthly_promo.py

      - name: Cleanup old R2 objects
        if: always()
        run: |
          pip install boto3
          python scripts/r2_cleanup.py
