# .github/workflows/slack_test.yml
# ===============================================
# GSM GPVファイルを描画 → Slackへ自動投稿テスト
# ===============================================

name: GSM Weather Map Slack Test

on:
  workflow_dispatch:

jobs:
  gsm-slack-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev fonts-ipafont-gothic

      - name: Install Python requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ---- ここでGSMファイルダウンロードが必要なら追加 ----
      # 例：既にdata/以下に配置済みなら不要
      # - name: Download latest GSM GRIB2 (オプション)
      #   run: |
      #     python3 scripts/download_gsm_latest.py

      - name: Plot GSM weather map and post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python3 gsm_plot_mslp_slack.py
