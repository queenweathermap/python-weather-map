# .github/workflows/slack_test.yml
# ===============================================
# MSM GPVファイルを描画 → Slackへ自動投稿テスト
# ===============================================

name: MSM Weather Map Slack Test

on:
  workflow_dispatch:

jobs:
  msm-slack-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev fonts-ipafont-gothic

      - name: Install Python requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Upload and notify
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python3 msm_plot_mslp_test.py
