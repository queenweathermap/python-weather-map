name: Run JMA Windprofiler (Capture Only)

on:
  schedule:
    # JST 00:15 / 06:15 / 12:15 / 18:15（6時間おき。サイト表示は約7時間分の
    # ローリングウィンドウのため、約1時間の重なりで1日を切れ目なくカバーする）
    # UTC 15:15(前日) / 21:15(前日) / 03:15 / 09:15
    # ここではDiscordへ投稿せず、地点ごとのraw画像をR2へ保存するだけ。
    # 前日分のまとめ配信は windprofiler-daily-stations.yml（3時JST）が行う。
    # 観測データは多少遅れても実害が小さいため、GitHub Actions自体のscheduleに
    # 戻す(Cloudflare Worker側でcronを後から追加編集した際、その追加分だけ
    # 丸一日発火しない不具合が実際に起きたため、予測図系だけWorker側に残し、
    # 観測データ系はこちらに戻した)。
    - cron: "15 3,9,15,21 * * *"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # R2
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "windprofiler"
      R2_RETENTION_DAYS: "21"
      R2_CLEANUP_DRY_RUN: "0"

      # ------------------------------------------------------------
      # スクリーンショット設定
      # ------------------------------------------------------------
      WINDPROFILER_VIEWPORT_WIDTH: "1050"
      WINDPROFILER_VIEWPORT_HEIGHT: "760"
      WINDPROFILER_WAIT_MS: "1200"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow playwright boto3

      - name: Get installed Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pip show playwright | grep Version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium

      - name: Run JMA Windprofiler (Capture Only)
        run: |
          python scripts/windprofiler_capture.py

      - name: Cleanup old R2 objects
        if: always()
        run: |
          python scripts/r2_cleanup.py
