name: Run JMA Amedas

on:
  schedule:
    # 06:00 / 12:00 / 18:00 JST  →  21:00(前日) / 03:00 / 09:00 UTC
    - cron: "0 21,3,9 * * *"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # Discord  #amedas 専用チャンネル
      # ------------------------------------------------------------
      DISCORD_AMEDAS_WEBHOOK_URL: ${{ secrets.DISCORD_AMEDAS_WEBHOOK_URL }}

      AMEDAS_RANK_TOP_N: "10"

      # ------------------------------------------------------------
      # WCN（気象キャスターネットワーク）会員ページの Basic 認証
      # ------------------------------------------------------------
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}

      # ------------------------------------------------------------
      # スクリーンショット設定
      # ------------------------------------------------------------
      GUIDANCE_VIEWPORT_WIDTH: "1400"
      GUIDANCE_VIEWPORT_HEIGHT: "1200"
      GUIDANCE_WAIT_MS: "3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f
          pip install Pillow requests playwright

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Run JMA Amedas
        run: |
          python scripts/jma_amedas.py

      - name: Screenshot WCN Amedas pages
        run: |
          python scripts/wcn_amedas.py
