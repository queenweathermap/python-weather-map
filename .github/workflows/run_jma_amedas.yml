name: Run JMA Amedas

on:
  schedule:
    # 06:00 / 12:00 / 18:00 JST  →  21:00(前日) / 03:00 / 09:00 UTC
    - cron: "0 21,3,9 * * *"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # Discord  #amedas 専用チャンネル
      # ------------------------------------------------------------
      DISCORD_AMEDAS_WEBHOOK_URL: ${{ secrets.DISCORD_AMEDAS_WEBHOOK_URL }}

      AMEDAS_RANK_TOP_N: "10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get install -y fonts-noto-cjk
          pip install Pillow

      - name: Run JMA Amedas
        run: |
          python scripts/jma_amedas.py
