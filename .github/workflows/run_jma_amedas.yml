name: Run JMA Amedas

on:
  schedule:
    # 03:00 / 15:00 JST  →  18:00 / 06:00 UTC
    - cron: "0 18,6 * * *"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # Discord  #amedas 専用チャンネル
      # ------------------------------------------------------------
      DISCORD_AMEDAS_WEBHOOK_URL: ${{ secrets.DISCORD_AMEDAS_WEBHOOK_URL }}

      AMEDAS_RANK_TOP_N: "10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run JMA Amedas
        run: |
          python scripts/jma_amedas.py
