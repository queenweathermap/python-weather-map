name: Run JMA Weather Map

on:
  schedule:
    # 07:00 / 13:00 / 19:00 / 01:00JST
    # 22:00（翌日朝） / 04:00 / 10:00 / 16:00（深夜）UTC
    - cron: "0 22,4,10,16 * * *"

  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # Weathercaster 認証
      # ------------------------------------------------------------
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}

      # ------------------------------------------------------------
      # R2
      # ※画像URLの公開ベースURLは、以前の運用どおり ASSET_BASE_URL を使う
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "weathercaster"
      R2_RETENTION_DAYS: "30"
      R2_CLEANUP_DRY_RUN: "0"

      # ------------------------------------------------------------
      # Notion
      # ------------------------------------------------------------
      NOTION_ENABLE: "1"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_IMPORT_IMAGES: "1"
      NOTION_IMPORT_TIMEOUT_SECONDS: "240"
      NOTION_IMPORT_POLL_SECONDS: "2.0"

      NOTION_PROP_TITLE: "名前"
      NOTION_PROP_CATEGORY: "区分"
      NOTION_PROP_INIT_JST: "発行基準時刻"
      NOTION_PROP_MEMO: "メモ"
      NOTION_PROP_RJTD: "RJTD"
      NOTION_PROP_PREFIX: "prefix"
      NOTION_PROP_R2URL: "R2 URL"
      NOTION_PROP_AUTOGEN: "自動生成"

      # ------------------------------------------------------------
      # Discord
      # Weathercaster / JMA天気図 専用チャンネル
      # ------------------------------------------------------------
      DISCORD_ENABLE: "1"
      DISCORD_WEATHERCASTER_WEBHOOK_URL: ${{ secrets.DISCORD_WEATHERCASTER_WEBHOOK_URL }}
      DISCORD_MAX_IMAGES_PER_MESSAGE: "10"
      DISCORD_SLEEP_SEC: "1.0"

      # Discord高解像度投稿
      # まずPNGをファイル添付。大きすぎる場合は、画素数を維持してJPEG化して投稿。
      DISCORD_UPLOAD_AS_FILE: "1"
      DISCORD_MAX_UPLOAD_MB: "8"
      DISCORD_JPEG_QUALITY: "88"

      # ------------------------------------------------------------
      # Slackは停止
      # ------------------------------------------------------------
      SLACK_ENABLE: "0"
      SLACK_WEBHOOK_URL: ""

      # ------------------------------------------------------------
      # Mail
      # Gmail/SMTPのサイズ制限・拒否が出たため停止。
      # 以後は Discord + Notion で配信する。
      # ------------------------------------------------------------
      MAIL_ENABLE: "0"
      MAIL_SLACK_NOTIFY: "0"
      MAIL_SLACK_MODE: "off"

      # ------------------------------------------------------------
      # PDF / PNG設定
      # 高解像度解析用。weather_map.py は PDF_DPI を優先し、
      # 未設定時だけ JPEG_DPI を参照する。
      # ------------------------------------------------------------
      PDF_DPI: "220"
      JPEG_DPI: "220"
      JPEG_QUALITY: "85"
      PNG_OPTIMIZE: "1"

      # 発行基準時刻の推定に使うPDF
      WEATHERCASTER_ISSUE_PROBE_PDFS: "COMP12.pdf,COMP36.pdf,COMP72.pdf"

      # エマグラム
      EMAGRAM_ENABLE: "1"
      EMAGRAM_URL: "https://bk-pro.jp/images/ema/ema_aki_00.gif"
      EMAGRAM_FILENAME: "ema_aki_00.gif"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow pdf2image boto3 notion-client

      - name: Run Weathercaster
        run: |
          python scripts/jma_weather_map.py

      - name: Cleanup old R2 objects
        if: always()
        run: |
          python scripts/r2_cleanup.py
