#.github/workflows/run_jma.yml

name: Run JMA Weathercaster

on:
  schedule:
    - cron: "30 4 * * *"   # 13:30 JST = 04:30 UTC
  workflow_dispatch: {}

concurrency:
  group: run-jma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-jma:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL:   ${{ secrets.TO_EMAIL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT:   ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      # ★Webhook名の整合
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      MAIL_SUBJECT_PREFIX: "[JMA]"

      # ★JMA認証をActionsに渡す（.env不要化）
      JMA_ADV_USER: ${{ secrets.JMA_ADV_USER }}
      JMA_ADV_PASS: ${{ secrets.JMA_ADV_PASS }}
      JMA_AUTH_BASIC: ${{ secrets.JMA_AUTH_BASIC }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (pdf2image backend & fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps (light)
        run: |
          python -m pip install -U pip
          pip install requests pdf2image pillow python-dotenv   # ← 追加

      - name: Run JMA script
        run: python scripts/weathercaster_jma.py
