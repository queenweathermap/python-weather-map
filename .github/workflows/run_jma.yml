name: Run JMA Weathercaster

on:
  schedule:
    # 02:00 / 08:00 / 14:00 / 20:00 JST
    - cron: "00 17 * * *"
    - cron: "00 23 * * *"
    - cron: "00 5  * * *"
    - cron: "00 11 * * *"
  workflow_dispatch: {}

concurrency:
  group: run-jma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-jma:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

      # =====================
      # Slack（通知）
      # =====================
      SLACK_ENABLE: "1"
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      # =====================
      # 配信モード
      # =====================
      DELIVERY_MODE: "notion"

      # =====================
      # Weathercaster 認証
      # =====================
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}

      # =====================
      # R2（Cloudflare）
      # =====================
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "weathercaster"

      # =====================
      # Notion
      # =====================
      NOTION_ENABLE: "1"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      # Notion プロパティ名
      NOTION_PROP_TITLE: "名前"
      NOTION_PROP_CATEGORY: "区分"
      NOTION_PROP_MODEL: "区分"
      NOTION_PROP_INIT_JST: "発行基準時刻"
      NOTION_PROP_RJTD: "RJTD"
      NOTION_PROP_PREFIX: "prefix"
      NOTION_PROP_R2URL: "R2 URL"
      NOTION_PROP_AUTOGEN: "自動生成"
      NOTION_PROP_MEMO: "メモ"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-jma.txt

      - name: Run Weathercaster JMA
        run: python scripts/jma_weathercaster.py
