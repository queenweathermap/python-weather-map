# .github/workflows/run_jma.yml
name: Run JMA Weathercaster

on:
  schedule:
    - cron: "30 4 * * *"   # 13:30 JST = 04:30 UTC
  workflow_dispatch: {}

concurrency:
  group: run-jma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-jma:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

      # =====================
      # 配信モード（最終形：notion）
      # =====================
      DELIVERY_MODE: "notion"  # notion only

      # =====================
      # Weathercaster 認証（必要）
      # =====================
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}

      # =====================
      # R2（Cloudflare）
      # =====================
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "weathercaster"  # 任意

      # =====================
      # Notion（同一DBへ格納）
      # =====================
      NOTION_ENABLE: "1"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      # DBプロパティ名（必要なら上書き）
      NOTION_PROP_TITLE: "名前"
      NOTION_PROP_CATEGORY: "区分"
      NOTION_PROP_INIT_JST: "初期時刻（JST）"
      NOTION_PROP_RJTD: "RJTD"
      NOTION_PROP_PREFIX: "prefix"
      NOTION_PROP_R2URL: "R2 URL"
      NOTION_PROP_AUTOGEN: "自動生成"
      NOTION_PROP_MEMO: "メモ"

      # =====================
      # Mail / Slack（最終的に不要：今は空でもOKにしておく）
      # ※ スクリプト側で完全分離したら、このブロックも消せる
      # =====================
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL:   ${{ secrets.TO_EMAIL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT:   ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_SUBJECT_PREFIX: "[JMA]"
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (pdf2image backend & fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install requests pdf2image pillow

      - name: Run JMA Weathercaster script
        run: python scripts/jma_weathercaster.py
