name: Run JMA Weathercaster

on:
  workflow_dispatch:

  schedule:
    # 05:20 / 11:20 / 17:20 / 23:20 JST
    # 20:20 / 02:20 / 08:20 / 14:20 UTC
    - cron: "20 20,2,8,14 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

      # ------------------------------------------------------------
      # Weathercaster 認証
      # ------------------------------------------------------------
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}

      # ------------------------------------------------------------
      # R2
      # ------------------------------------------------------------
      R2_ENABLE: "1"
      R2_PREFIX: "weathercaster"

      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      
      ASSET_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

      # ------------------------------------------------------------
      # Notion
      # ------------------------------------------------------------
      NOTION_ENABLE: "1"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      NOTION_PROP_TITLE: "名前"
      NOTION_PROP_CATEGORY: "区分"
      NOTION_PROP_INIT_JST: "発行基準時刻"
      NOTION_PROP_MEMO: "メモ"
      NOTION_PROP_RJTD: "RJTD"
      NOTION_PROP_PREFIX: "prefix"
      NOTION_PROP_R2URL: "R2 URL"
      NOTION_PROP_AUTOGEN: "自動生成"

      # ------------------------------------------------------------
      # Discord
      # Weathercaster / JMA天気図 専用チャンネル
      # ------------------------------------------------------------
      DISCORD_ENABLE: "1"
      DISCORD_WEATHERCASTER_WEBHOOK_URL: ${{ secrets.DISCORD_WEATHERCASTER_WEBHOOK_URL }}

      DISCORD_MAX_IMAGES_PER_MESSAGE: "10"
      DISCORD_SLEEP_SEC: "1.0"

      # ------------------------------------------------------------
      # Slackは停止
      # ------------------------------------------------------------
      SLACK_ENABLE: "0"
      SLACK_WEBHOOK_URL: ""

      # ------------------------------------------------------------
      # PDF / JPG設定
      # ------------------------------------------------------------
      JPEG_DPI: "200"
      JPEG_QUALITY: "85"

      # 発行基準時刻の推定に使うPDF
      WEATHERCASTER_ISSUE_PROBE_PDFS: "COMP12.pdf,COMP36.pdf,COMP72.pdf"

      # エマグラム
      EMAGRAM_ENABLE: "1"
      EMAGRAM_URL: "https://bk-pro.jp/images/ema/ema_aki_00.gif"
      EMAGRAM_FILENAME: "ema_aki_00.gif"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow pdf2image boto3 notion-client

      - name: Run Weathercaster
        run: |
          python scripts/jma_weathercaster.py
