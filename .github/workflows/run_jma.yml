# .github/workflows/run_jma.yml
name: Run JMA Weathercaster

on:
  schedule:
    - cron: "30 19 * * *"  # 04:30 JST
    - cron: "30 7 * * *"  # 16:30 JST
  workflow_dispatch: {}

concurrency:
  group: run-jma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-jma:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

      # =====================
      # 配信モード（最終形）
      # =====================
      DELIVERY_MODE: "notion"

      # =====================
      # Weathercaster 認証
      # =====================
      WEATHERCASTER_USER: ${{ secrets.WEATHERCASTER_USER }}
      WEATHERCASTER_PASS: ${{ secrets.WEATHERCASTER_PASS }}

      # =====================
      # R2（Cloudflare）
      # =====================
      R2_ENABLE: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
      R2_PREFIX: "weathercaster"

      # =====================
      # Notion（wx 天気図 DB）
      # =====================
      NOTION_ENABLE: "1"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      # DBプロパティ名（必要なら上書き）
      NOTION_PROP_TITLE: "名前"
      NOTION_PROP_CATEGORY: "区分"
      NOTION_PROP_MODEL: "区分"      # Weathercaster互換
      NOTION_PROP_INIT_JST: "発行基準時刻"
      NOTION_PROP_RJTD: "RJTD"
      NOTION_PROP_PREFIX: "prefix"
      NOTION_PROP_R2URL: "R2 URL"
      NOTION_PROP_AUTOGEN: "自動生成"
      NOTION_PROP_MEMO: "メモ"

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (pdf2image backend & fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-jma.txt

      - name: Run JMA Weathercaster
        run: python scripts/jma_weathercaster.py
