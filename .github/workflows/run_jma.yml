#.github/workflows/run_jma.yml

name: Run JMA Weathercaster

on:
  schedule:
    # 例：毎日 13:30 JST = 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: run-jma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-jma:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}   # ← これを追加
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL:   ${{ secrets.TO_EMAIL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT:   ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      MAIL_SUBJECT_PREFIX: "[JMA]"
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (pdf2image backend & fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps (light)
        run: |
          python -m pip install -U pip
          pip install requests pdf2image pillow

      - name: Run JMA script
        run: python scripts/weathercaster_jma.py
